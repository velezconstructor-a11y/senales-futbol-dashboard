<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReyBetIA — El Rey de Ambos Marcan</title>
<link rel="icon" href="./favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --pitch-950:#0a1f1f;
    --pitch-900:#0f2a2a;
    --pitch-800:#163a3a;
    --pitch-700:#1e4a4a;
    --line:#2b4f4f;
    --chalk:#f4f7f2;
    --chalk-dim:#b9c9bd;
    --amber:#d19a3d;
    --amber-dim:#6b4a1a;
    --win:#4cb56d;
    --win-bg:rgba(76,181,109,0.12);
    --loss:#e2564c;
    --loss-bg:rgba(226,86,76,0.12);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--pitch-800), transparent),
      repeating-linear-gradient(90deg, transparent 0 79px, rgba(244,247,242,0.025) 79px 80px),
      var(--pitch-950);
    color:var(--chalk);
    font-family:var(--sans);
    min-height:100vh;
    padding:0 0 64px;
  }
  a{color:var(--amber);}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px;}

  header.top{
    padding:28px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--line);
    margin-bottom:0;
    background: radial-gradient(ellipse 500px 200px at 50% 0%, rgba(209,154,61,0.08), transparent);
  }
  .logo-img{
    width:64px;height:64px;border-radius:50%;
    border:2px solid var(--amber-dim);
    box-shadow:0 0 24px rgba(209,154,61,0.25);
    margin-bottom:10px;
  }
  .brand{
    font-family:var(--mono);
    font-weight:700;
    font-size:24px;
    letter-spacing:.02em;
    margin:0;
  }
  .brand span{color:var(--amber);}
  .tagline{
    font-size:11px;
    color:var(--chalk-dim);
    text-transform:uppercase;
    letter-spacing:.15em;
    margin:4px 0 0;
    font-family:var(--mono);
  }
  .updated{
    font-size:11px;
    color:var(--chalk-dim);
    margin-top:8px;
    font-family:var(--mono);
  }
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--win);margin-right:6px;vertical-align:1px;
    box-shadow:0 0 8px var(--win);}

  .hero-pick{
    max-width:980px;margin:20px auto 0;padding:0 20px;
    display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:12px;
  }
  .hero-pick-card{
    position:relative;
    background:linear-gradient(135deg, var(--pitch-800) 0%, var(--pitch-900) 60%);
    border:1px solid var(--amber-dim);
    border-radius:14px;
    padding:20px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    box-shadow:0 0 40px rgba(209,154,61,0.08);
  }
  .hero-pick-badge{
    font-family:var(--mono);font-size:11px;font-weight:700;
    color:var(--pitch-950);background:var(--amber);
    padding:4px 10px;border-radius:20px;letter-spacing:.05em;
    display:inline-block;margin-bottom:8px;
  }
  .hero-pick-teams{font-size:19px;font-weight:700;}
  .hero-pick-liga{font-size:12px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .hero-pick-right{text-align:right;font-family:var(--mono);}
  .hero-pick-pct{font-size:32px;font-weight:700;color:var(--amber);line-height:1;}
  .hero-pick-mkt{font-size:11px;color:var(--chalk-dim);margin-top:4px;text-transform:uppercase;letter-spacing:.05em;}
  @media (max-width:600px){.hero-pick-card{flex-direction:column;align-items:flex-start;}.hero-pick-right{text-align:left;}}

  .tabs{
    display:flex;
    overflow-x:auto;
    gap:4px;
    padding:14px 20px 0;
    border-bottom:1px solid var(--line);
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  /* Barra de dias (Hoy/Mañana/Pasado mañana): un nivel jerarquico por
     encima de las pestañas de mercado - mas chica y sutil para que no
     compita visualmente con la barra principal de abajo. */
  .dias-tabs{padding:10px 20px 8px;border-bottom:none;gap:6px;}
  .dia-btn{
    flex-shrink:0;
    padding:6px 14px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--chalk-dim);
    background:var(--surface-2);
    border:0.5px solid var(--border);
    border-radius:999px;
    cursor:pointer;
    transition:color .15s, background .15s, border-color .15s;
  }
  .dia-btn:hover{color:var(--chalk);}
  .dia-btn.active{color:var(--bg-1, #0a1210);background:var(--amber);border-color:var(--amber);}
  .dia-btn .dia-count{opacity:.7;font-weight:400;margin-left:4px;}
  .tab-btn{
    flex-shrink:0;
    background:transparent;
    border:none;
    color:var(--chalk-dim);
    font-family:var(--mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:10px 16px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s;
  }
  .tab-btn:hover{color:var(--chalk);}
  .tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}
  .tab-panel{display:none;padding-top:28px;}
  .tab-panel.active{display:block;}

  .section-title{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:12px;
    color:var(--chalk-dim);
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 0 16px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}
  section{margin-bottom:40px;}

  .market-hero{text-align:center;padding:20px 0 8px;}
  .market-hero .big{
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(40px,10vw,64px);
    line-height:1;
    background:linear-gradient(180deg, var(--chalk) 0%, var(--chalk-dim) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin:0;
  }
  .market-hero .sub{font-size:13px;color:var(--chalk-dim);margin-top:6px;font-family:var(--mono);}

  .conf-card{
    position:relative;
    background:linear-gradient(160deg, var(--pitch-800), var(--pitch-900));
    border:1px solid var(--amber-dim);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:10px;
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:14px;
    align-items:center;
  }
  .conf-teams{font-weight:600;font-size:15px;}
  .conf-liga{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .conf-tier{text-align:center;font-family:var(--mono);}
  .conf-tier-val{font-weight:700;font-size:15px;color:var(--amber);}
  .conf-cuota{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);margin-top:2px;}
  .conf-prob{font-family:var(--mono);font-size:20px;font-weight:700;text-align:right;}
  @media (max-width:600px){.conf-card{grid-template-columns:1fr;text-align:left;}.conf-prob{text-align:left;}}

  .match-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .match-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:12px;
    align-items:center;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .match-row:last-child{border-bottom:none;}
  .match-row:nth-child(even){background:rgba(244,247,242,0.015);}
  .match-teams{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .match-liga{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;}
  .match-pct{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);text-align:right;white-space:nowrap;}
  .match-badge{
    font-family:var(--mono);font-size:11px;font-weight:700;
    padding:3px 10px;border-radius:20px;text-align:center;min-width:34px;
  }
  .match-badge.ganada{background:var(--win-bg);color:var(--win);}
  .match-badge.perdida{background:var(--loss-bg);color:var(--loss);}
  .match-badge.si{background:var(--win-bg);color:var(--win);}
  .match-badge.no{background:var(--loss-bg);color:var(--loss);}
  .match-badge.score{background:var(--pitch-700);color:var(--amber);min-width:44px;}

  @media (max-width:420px){
    .match-row{grid-template-columns:1fr;text-align:left;gap:6px;}
    .match-pct{text-align:left;}
  }

  .empty{text-align:center;padding:40px 20px;color:var(--chalk-dim);font-family:var(--mono);font-size:13px;}

  .tickets{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px,1fr));gap:16px;}
  .ticket{position:relative;background:var(--pitch-800);border:1px solid var(--line);border-radius:10px;padding:20px 18px 16px;}
  .ticket::before,.ticket::after{content:"";position:absolute;width:16px;height:16px;background:var(--pitch-950);border:1px solid var(--line);border-radius:50%;top:50%;transform:translateY(-50%);}
  .ticket::before{left:-9px;}
  .ticket::after{right:-9px;}
  .ticket-name{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--chalk-dim);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .ticket-status{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .ticket-status.win{background:var(--win);box-shadow:0 0 6px var(--win);}
  .ticket-status.loss{background:var(--loss);box-shadow:0 0 6px var(--loss);}
  .ticket-status.none{background:#445c4e;}
  .ticket-pct{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;}
  .ticket-meta{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);margin-top:8px;display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px;}
  .ticket-units{font-weight:600;}
  .ticket-units.win{color:var(--win);}
  .ticket-units.loss{color:var(--loss);}

  .cmp-table{width:100%;border-collapse:collapse;font-size:14px;}
  .cmp-table th{text-align:left;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);font-weight:500;padding:0 10px 10px;border-bottom:1px solid var(--line);}
  .cmp-table th.num, .cmp-table td.num{text-align:right;font-family:var(--mono);}
  .cmp-table td{padding:10px;border-bottom:1px solid var(--line);}
  .cmp-table tr:last-child td{border-bottom:none;}
  .cmp-table td.name{display:flex;align-items:center;gap:8px;}
  .row-alt td{background:rgba(244,247,242,0.015);}

  .chart-card{background:var(--pitch-800);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .chart-wrap{position:relative;height:220px;}

  .bars{display:flex;flex-direction:column;gap:10px;}
  /* CORREGIDO 24 ago 2026: nombres largos (ej. perfil_defensa_doble_floja,
     rescate_evitar_edge_bajo_prob_baja) desbordaban la columna fija de
     140px y se montaban sobre la barra de progreso, haciendolos
     ilegibles. Se ensancha la columna y se permite pasar a 2 lineas en
     vez de desbordarse, alineando arriba (no al centro) para que se vea
     bien tanto con nombres cortos como largos. */
  .bar-row{display:grid;grid-template-columns:170px 1fr auto;align-items:start;gap:12px;font-size:13px;padding:3px 0;}
  .bar-label{color:var(--chalk-dim);font-family:var(--mono);font-size:12px;white-space:normal;word-break:break-word;line-height:1.35;padding-top:2px;}
  .bar-track{height:8px;background:var(--pitch-700);border-radius:4px;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;border-radius:4px;}
  .bar-fill.win{background:var(--win);}
  .bar-fill.loss{background:var(--loss);}
  .bar-num{font-family:var(--mono);font-size:12px;text-align:right;color:var(--chalk-dim);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  @media (max-width:700px){.grid2{grid-template-columns:1fr;gap:28px;}}

  .picks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .pick{display:grid;grid-template-columns:70px 1fr auto auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;}
  .pick:last-child{border-bottom:none;}
  .pick:nth-child(even){background:rgba(244,247,242,0.015);}
  .pick-date{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);}
  .pick-teams{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pick-tier{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--amber-dim);color:var(--amber);white-space:nowrap;}
  .pick-result{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .pick-result.win{background:var(--win-bg);color:var(--win);}
  .pick-result.loss{background:var(--loss-bg);color:var(--loss);}
  .pick-result.pending{background:var(--pitch-700);color:var(--chalk-dim);}

  footer.note{text-align:center;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);padding-top:24px;line-height:1.7;}
  .loading, .error{text-align:center;padding:60px 20px;color:var(--chalk-dim);font-family:var(--mono);font-size:13px;}
  .error{color:var(--loss);}
  ::selection{background:var(--amber);color:var(--pitch-950);}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  /* ===== SELECCION VIP (30 oct 2026) ===== */
  .vip-tiles{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:10px;margin:0 0 18px;}
  .vip-tile{background:var(--pitch-800);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .vip-tile .lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);}
  .vip-tile .val{font-size:28px;font-weight:700;line-height:1.1;margin-top:8px;font-family:var(--sans);}
  .vip-tile .sub{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-top:8px;line-height:1.5;}
  .vip-verdict{background:var(--pitch-800);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:16px 18px;font-size:14px;line-height:1.6;}
  .vip-verdict p{margin:0 0 10px;}
  .vip-verdict p:last-child{margin-bottom:0;}
  .vip-aviso{background:rgba(209,154,61,0.08);border:1px solid var(--amber-dim);border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.55;color:var(--chalk);margin:0 0 14px;}
  .vip-dim{color:var(--chalk-dim);}
  .vip-nota{font-family:var(--mono);font-size:10.5px;color:var(--chalk-dim);margin-top:2px;line-height:1.4;font-weight:400;}
  .vip-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .vip-scroll .cmp-table{min-width:640px;}
  .vip-chip{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:20px;border:1px solid var(--amber-dim);color:var(--amber);white-space:nowrap;}
  .vip-chip.fuerte{background:var(--amber);color:var(--pitch-950);border-color:var(--amber);}
  .vip-chip.gris{border-color:var(--line);color:var(--chalk-dim);}
  .vip-semaforo{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--chalk);}
  .vip-semaforo .pt{width:9px;height:9px;border-radius:50%;background:#445c4e;flex-shrink:0;}
  .vip-semaforo.ok .pt{background:var(--win);box-shadow:0 0 6px var(--win);}
  .vip-semaforo.mal .pt{background:var(--loss);box-shadow:0 0 6px var(--loss);}
  .vip-semaforo.medio .pt{background:var(--amber);box-shadow:0 0 6px var(--amber);}
  .vip-prog{margin-top:10px;}
  .vip-prog .bar-track{margin-top:0;height:8px;}
  .vip-prog .bar-fill{background:var(--amber);}
  .vip-prog-txt{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-top:6px;flex-wrap:wrap;}
  .vip-det{margin-top:12px;font-size:12px;color:var(--chalk-dim);font-family:var(--mono);}
  .vip-det summary{cursor:pointer;padding:4px 0;}
  .vip-det summary:hover{color:var(--chalk);}
  .vip-chart{position:relative;}
  .vip-chart svg{display:block;width:100%;height:auto;touch-action:pan-y;}
  .vip-chart svg:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px;}
  .vip-leyenda{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--chalk-dim);font-family:var(--mono);}
  .vip-leyenda .k{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px;border-radius:2px;}
  .vip-tip{position:absolute;pointer-events:none;z-index:5;background:var(--pitch-950);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.55;min-width:150px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  .vip-tip .f{color:var(--chalk-dim);margin-bottom:4px;}
  .vip-tip .r{display:flex;align-items:center;gap:8px;}
  .vip-tip .r .k{display:inline-block;width:12px;height:0;border-top:2px solid;border-radius:2px;flex-shrink:0;}
  .vip-tip .r b{font-size:13px;margin-left:auto;padding-left:12px;}
  .vip-pick-vacio{border:1px dashed var(--line);border-radius:10px;padding:22px 18px;text-align:center;color:var(--chalk-dim);font-size:13px;line-height:1.6;}

  .vip-scroll .cmp-table td.num, .vip-scroll .cmp-table th.num{white-space:nowrap;}
  .vip-scroll .cmp-table td.vip-nom{min-width:150px;}
  .vip-scroll .cmp-table td:first-child, .vip-scroll .cmp-table th:first-child{position:sticky;left:0;z-index:1;background:var(--pitch-950);}
  @media (max-width:620px){
    .vip-scroll .cmp-table{min-width:760px;}
    .vip-tile .val{font-size:24px;}
  }
  .vip-scroll .cmp-table tr.vip-dest td{background:rgba(209,154,61,0.07);}
  .vip-scroll .cmp-table tr.vip-dest td:first-child{background:linear-gradient(rgba(209,154,61,0.07), rgba(209,154,61,0.07)), var(--pitch-950);}
  .vip-scroll .cmp-table tr.vip-tenue td{color:var(--chalk-dim);}
  .vip-scroll .cmp-table tr.vip-tenue td .vip-nota{color:var(--amber);}
  /* 30 oct 2026: tabla corta (por mes) - cabe en pantallas angostas sin desplazar */
  .vip-scroll.vip-corta .cmp-table{min-width:0;}
  @media (max-width:620px){
    .vip-scroll.vip-corta .cmp-table th{padding-left:6px;padding-right:6px;letter-spacing:.03em;font-size:10px;}
    .vip-scroll.vip-corta .cmp-table td{padding-left:6px;padding-right:6px;font-size:13px;}
  }
  /* 30 oct 2026: tarjeta "activas y estables" en celular: la columna del nombre no debe comerse la pantalla,
     para que se vean Apuestas / ROI / Unidades sin deslizar */
  .vip-scroll.vip-corta .cmp-table td.vip-nom{min-width:0;}
  @media (max-width:620px){
    .vip-scroll.vip-ae .cmp-table{min-width:0;width:690px;table-layout:fixed;}
    .vip-scroll.vip-ae .cmp-table th:nth-child(1){width:150px;}
    .vip-scroll.vip-ae .cmp-table th:nth-child(2){width:84px;}
    .vip-scroll.vip-ae .cmp-table th:nth-child(3){width:72px;}
    .vip-scroll.vip-ae .cmp-table th:nth-child(4){width:84px;}
    .vip-scroll.vip-ae .cmp-table th:nth-child(5){width:76px;}
    .vip-scroll.vip-ae .cmp-table th:nth-child(6){width:104px;}
    .vip-scroll.vip-ae .cmp-table th:nth-child(7){width:120px;}
  }
  /* 30 oct 2026: tablas de los dos grupos de señales (una columna por mes) */
  .vip-scroll.vip-gr .cmp-table{min-width:0;table-layout:fixed;width:100%;}
  .vip-scroll.vip-gr .cmp-table td.vip-nom{min-width:0;}
  .vip-scroll.vip-gr .cmp-table th .vip-nota{text-transform:none;letter-spacing:0;}
  .vip-solo-movil{display:none;}

let ORDEN_DETALLE = "estable";
function puntajeEstable(s){
  const n = nOf(s);
  if(n === 0) return -Infinity;
  return (s.profit_u ?? 0) / n * 100 - 74 / Math.sqrt(n);

// reglas_activas.es_estable() (la usa el bot de Telegram).
let ESTADISTICAS_MOTIVOS = {};
const MIN_CASOS_ESTABLE = 25;
function esEstable(motivo){
  const s = ESTADISTICAS_MOTIVOS[motivo];
  if(!s) return true;
  const n = nOf(s);
  if(n < MIN_CASOS_ESTABLE) return true;
  return (s.profit_u ?? 0) / n >= 0;
}

  if(!MOTIVOS_VALIDADOS.has(motivo)) return false;

  if(!(motivo in REGLAS_ACTIVAS_REAL)) return true;

function notaRescateBtts(p){
  // Muestra que camino especifico produjo (o intento producir) la señal
  // de BTTS. CORREGIDO 24 ago 2026: antes exigia nivel_final==='JUGAR',
  // pero Estadisticas ("Por que se activo JUGAR") cuenta TODOS los
  // partidos con ese motivo, hayan llegado a JUGAR o no (una regla puede
  // estar desactivada y el partido igual queda etiquetado, solo que en
  // EVITAR) - con la restriccion vieja, esos partidos no mostraban
  // ninguna nota, haciendo imposible encontrar en la lista de partidos
  // cuales corresponden a cada linea del resumen. Ahora se muestra
  // siempre que haya un motivo real, distinguiendo con opacidad si
  // ademas genero JUGAR o se quedo en EVITAR.
  const motivo = p.motivo_btts;
  if(!motivo || motivo === "ninguno_evitar_final" || motivo === "candado_sin_cuota") return "";
  const esRescate = motivo.startsWith("rescate_");
  const texto = ETIQUETAS_BTTS[motivo] || motivo;
  const color = esRescate ? "var(--amber)" : "var(--chalk-dim)";
  const opacidad = p.nivel_final === "JUGAR" ? "1" : "0.6";
  // AGREGADO 18 oct 2026: señales APAGADAS en prueba (versiones "+", Cumbre y
  // Stake 9 mejoradas) que tambien aplican a este partido: se muestran como
  // etiqueta extra para poder ver como les va, aunque no decidan el JUGAR.
  const _tagsBtts = String(p.motivos_btts_todos || "").split("|");
  // Los 3 niveles del Índice BTTS son anidados (top 5% => también top 10% y 20%):
  // en la tarjeta se muestra solo el más alto; Estadísticas cuenta cada nivel.
  const _nivelIdx = ["idx_btts_top05","idx_btts_top10","idx_btts_top20"].find(t => _tagsBtts.includes(t));
  const enPrueba = _tagsBtts
    .filter(t => SENALES_EN_PRUEBA.has(t) && t !== motivo && !(t.startsWith("idx_btts_") && t !== _nivelIdx))
    .map(t => `<span title="Señal apagada en prueba: aplica a este partido pero no decide el JUGAR" style="color:var(--amber);opacity:0.9;">${ETIQUETAS_BTTS[t] || t}</span>`);
  const extra = enPrueba.length ? "<br>" + enPrueba.join("<br>") : "";
  return ` · <span title="Por que se activo esta señal de BTTS" style="color:${color};opacity:${opacidad};">${texto}</span>${extra}`;
}

function mejorCasaBadge(p, mercado){
  // Muestra en que casa colombiana conviene apostar este pick.
  // Medido con datos reales (23 ago 2026): apostar en la casa que mejor
  // paga da ~+7.6% mas de ganancia por apuesta que hacerlo en la peor,
  // sin cambiar nada de las señales. Solo aparece en partidos de ligas
  // que las casas colombianas cotizan (las menores no las cotizan).
  const casa = p["mejor_casa_" + mercado];
  const cuota = p["mejor_cuota_" + mercado];
  const mejora = p["mejora_" + mercado + "_pct"];
  if(!casa || cuota == null) return "";
  const nombres = {
    "betplay":"BetPlay", "betsson":"Betsson", "betano":"Betano",
    "bet365":"bet365", "bwin":"bwin", "stake":"Stake", "codere.es":"Codere",
  };
  const bonito = nombres[casa] || casa;
  const txtMejora = (mejora != null && mejora > 0.5)
    ? ` <span style="color:var(--win);">+${mejora.toFixed(1)}%</span>` : "";
  return ` · <span title="Casa colombiana que mejor paga este mercado">💰 ${bonito} ${cuota.toFixed(2)}${txtMejora}</span>`;
}

function edgeTxt(prob, cuota){
  // Edge = probabilidad que decimos - probabilidad que ya implica la cuota
  // del mercado. Solo se muestra cuando es positivo (creemos tener ventaja
  // real sobre lo que ya cobra la cuota) - un edge negativo no se destaca.
  if(prob == null || !cuota) return "";
  const edge = prob - (1 / cuota);
  if(edge <= 0) return "";
  return ` · <span style="color:var(--amber);">edge +${(edge*100).toFixed(1)}%</span>`;
}

    extra += ' · <span title="Uno de los dos equipos es filial/reserva/desarrollo (plantel rotativo) - dato informativo, no cambia la señal." style="color:var(--chalk-dim);">🏷️ filial</span>';
  }
  if(p.usa_temporada_anterior){
    return extra + ' · <span title="Uno de los equipos no tiene suficiente muestra ni de su lado ni en general esta temporada, se usaron datos de la temporada anterior" style="color:var(--chalk-dim);">🔄 temp. anterior</span>';
  }
  if(p.usa_promedio_general){
    return extra + ' · <span title="Uno de los equipos todavia no tiene suficientes partidos como local/visitante, se uso el promedio general de la temporada" style="color:var(--chalk-dim);">📊 promedio general</span>';
  }
  return extra;
}

function confirmacionCuotaBadge(p, mercado){
  // mercado: "btts" | "o15" | "o25". movimiento_X_pp ya viene calculado
  // desde el servidor (backtest.py) y solo tiene valor si esa señal
  // especifica es JUGAR - si es null, no aplica (no es JUGAR, o falta dato).
  const mov = p["movimiento_" + mercado + "_pp"];
  const umbral = (DATA && DATA.umbral_movimiento_pp) || 4;
  // 29 oct 2026: ALZA de cuota. Si la cuota SUBIO >=2% desde que se detecto
  // el pick, el mercado se esta alejando de el. Medido en el historico (4
  // mercados, ~2.300 apuestas, en las dos mitades del periodo): ROI -13% con
  // alza >=2% contra -7% sin movimiento (en las señales JUGAR la diferencia
  // fue menor: -8% contra -6%, pocos casos). Es informativo, no cambia la señal.
  const alza = p["alza_" + mercado + "_pct"];
  const umbralAlza = (DATA && DATA.umbral_alza_cuota_pct) || 2;
  if(alza != null && alza >= umbralAlza){
    const co = p["cuota_" + mercado + "_inicial"] ?? p["cuota_" + mercado];
    const ca = p["cuota_" + mercado + "_actual"];
    const txt = (co != null && ca != null) ? ` (${co.toFixed(2)} → ${ca.toFixed(2)})` : "";
    return ` · <span title="La cuota SUBIÓ ${alza.toFixed(1)}% desde que se detectó la señal: el mercado se está alejando de este pick. En el histórico (todos los partidos de BTTS, O1.5, O2.5 y 1er tiempo O0.5, 27 jul-6 sep) las apuestas con alza de 2% o más rindieron ROI -13% contra -7% las que no se movieron; entre las señales JUGAR la diferencia fue menor (-8% contra -6%, pocos casos). Dato informativo, no cambia la señal." style="color:var(--loss);">⚠️ cuota subiendo (+${alza.toFixed(1)}%)${txt}</span>`;
  }
  if(mov == null || mov < umbral) return "";
  // Se muestran las dos cuotas (original -> actual) ademas del porcentaje,
  // para que se pueda verificar a simple vista que cuota mas baja =
  // porcentaje positivo (antes solo se veia el %, y sin la cuota original
  // visible en ningun lado era facil confundirse sobre que subio o bajo).
  const cuotaOrig = p["cuota_" + mercado + "_inicial"] ?? p["cuota_" + mercado];
  const cuotaAct = p["cuota_" + mercado + "_actual"];
  const cuotasTxt = (cuotaOrig != null && cuotaAct != null)
    ? ` (${cuotaOrig.toFixed(2)} → ${cuotaAct.toFixed(2)})`
    : "";
  return ` · <span title="La probabilidad implicita de este mercado subio ${mov.toFixed(1)} puntos porcentuales desde que se detecto la señal (cuota bajando = el mercado confirma mas probabilidad)." style="color:var(--win);">📉 probabilidad subiendo (+${mov.toFixed(1)}pp)${cuotasTxt}</span>`;
}

function pctTxt(s, conN){
  if(!s) return "—";
  const n = s.bets ?? s.total ?? 0;
  if(n === 0) return "—";
  const wins = s.wins ?? s.ganados ?? 0;
  const pct = s.acierto_pct.toFixed(0) + "%";
  return conN ? `${pct} (${wins}/${n})` : pct;
}
function nOf(s){ return s ? (s.bets ?? s.total ?? 0) : 0; }
function statusClass(s){
  if(!s || nOf(s) === 0) return "none";
  return (s.profit_u ?? 0) >= 0 ? "win" : "loss";
}

function renderMercado(picks, probKey, senalKey, tierKey, cuotaKey, resultadoDeseado, resultKey, mercadoKey, motivoKey){
  // Lee la probabilidad, RECALIBRANDO al vuelo los partidos viejos: los
  // registrados antes de que existiera prob_btts_calibrada tienen ese
  // campo vacio para siempre (el sistema no recalcula partidos ya
  // guardados). ANTES este respaldo aplicaba una formula lineal fija
  // (0.329 + 0.355*cruda), pero esa formula quedo OBSOLETA cuando el
  // modelo de signals.py cambio (primero a tabla por categoria, despues
  // al modelo continuo Stake10+cs_max) - aplicarla ahora daria un numero
  // INVENTADO, no una recalibracion real. Es mas honesto mostrar la
  // probabilidad cruda tal cual para esos partidos viejos, que inventar
  // una recalibracion con una formula que ya no corresponde al modelo
  // actual.
  const P = (p) => {
    const v = p[probKey];
    if(v != null) return v;
    // Respaldo para partidos VIEJOS, guardados antes de que existiera la
    // columna calibrada correspondiente (el sistema no recalcula partidos
    // ya guardados). Se muestra la cruda tal cual - es mas honesto que
    // inventar una recalibracion. Generalizado 23 ago 2026 al agregar las
    // calibradas de Over 1.5, Over 2.5 y 1er tiempo.
    const respaldoCrudo = {
      "prob_btts_calibrada": "prob_btts",
      "prob_o15_calibrada": "prob_o15",
      "prob_o25_calibrada": "prob_o25",
      "prob_over05_ht_calibrada": "prob_over05_ht",
    }[probKey];
    if(respaldoCrudo && p[respaldoCrudo] != null) return p[respaldoCrudo];
    return null;
  };

  // "Validadas" / "En seguimiento" = decision JUGAR Y el nivel es un
  // nivel real de confianza (VIP+/VIP/Fuerte) - dentro de eso, se separa
  // por si el motivo especifico tiene evidencia de estabilidad
  // confirmada o no. NO incluye señales "Evitar" rescatadas a JUGAR por
  // la banda de cuota, porque esas no son de alta confianza aunque
  // tecnicamente jueguen.
  const conSenal = picks.filter(p => p[senalKey] === "JUGAR" && p[tierKey] && p[tierKey] !== "Evitar");
  const validadas = conSenal.filter(p => esValidadaReal(p[motivoKey]));
  const enSeguimiento = conSenal.filter(p => !esValidadaReal(p[motivoKey]));

  const renderCardsConfianza = (lista, vacioTxt) => lista.length === 0
    ? `<div class="empty">${vacioTxt}</div>`
    : lista.map(p => {
        const resultado = resultKey ? p[resultKey] : null;
        const resultadoHtml = resultado === true
          ? `<div class="conf-prob" style="color:var(--win);font-size:15px;">✓ Ganada</div>`
          : resultado === false
          ? `<div class="conf-prob" style="color:var(--loss);font-size:15px;">✕ Perdida</div>`
          : `<div class="conf-prob">${P(p) != null ? (P(p)*100).toFixed(0)+"%" : "—"}</div>`;
        return `
        <div class="conf-card">
          <div>
            <div class="conf-teams">${p.local} vs ${p.visitante}</div>
            <div class="conf-liga">${p.liga || ""} · ${diaBadge(p)}${mercadoKey === 'btts' ? vipNotaBtts(p) : ''}${respaldoBadge(p)}${confirmacionCuotaBadge(p, mercadoKey)}${notaLigaConfianza(p)}${mercadoKey === 'ht05' ? notaOver15Ht(p) : ''}${mercadoKey === 'btts' ? notaRescateBtts(p) : ''}${mercadoKey === 'o25' ? notaRescateO25(p) : ''}${mercadoKey === 'o15' ? notaRescateO15(p) : ''}${mercadoKey === 'ht05' ? notaRescateHt05(p) : ''}${mercadoKey === 'btts' ? notaBttsMinAlto(p) : ''}</div>
            ${badgesExtra(p)}
          </div>
          <div class="conf-tier">
            <div class="conf-tier-val">${p[tierKey] || "JUGAR"}</div>
            <div class="conf-cuota">cuota ${p[cuotaKey] ? p[cuotaKey].toFixed(2) : "—"}${edgeTxt(P(p), p[cuotaKey])}${mercadoKey === "btts" ? mejorCasaBadge(p, "btts") : (mercadoKey === "o25" ? mejorCasaBadge(p, "o25") : "")}</div>
          </div>
          ${resultadoHtml}
        </div>`;
      }).join("");

  // 30 oct 2026: en Ambos Marcan, con la Seleccion VIP activa, "Picks del Dia" muestra
  // la seleccion (Respaldada primero) y deja los demas JUGAR plegados aparte.
  const separaVip = mercadoKey === "btts" && vipActiva() && vipPol().solo_vip_en_telegram === true && picks.some(p => "vip_btts" in p);
  let validadasHtml;
  if(separaVip){
    const enSel = validadas.filter(p => vipClase(p)).sort(vipOrden);
    const fuera = validadas.filter(p => !vipClase(p));
    validadasHtml = renderCardsConfianza(enSel, "Hoy no hay picks de BTTS en la Selección VIP. No enviar nada es una decisión válida.")
      + (fuera.length ? `<details class="vip-det"><summary>Otros ${fuera.length} JUGAR de BTTS sin ventaja de precio (no se envían al Telegram)</summary><div style="margin-top:8px;">${renderCardsConfianza(fuera, "")}</div></details>` : "");
  } else {
    validadasHtml = renderCardsConfianza(validadas, "Sin señales validadas hoy todavía.");
  }
  const enSeguimientoHtml = renderCardsConfianza(enSeguimiento, "Nada en seguimiento hoy.");

  // Top probabilidad: independiente de si el modelo disparo formalmente "JUGAR"
  // (que es un criterio estricto de VIP+/VIP/Fuerte) - esto muestra los
  // partidos con la probabilidad mas alta de este mercado, punto, para que
  // siempre haya algo que ver aunque hoy no haya ninguna señal formal.
  const idsConSenal = new Set(conSenal.map(p => p.local + "|" + p.visitante + "|" + p.fecha));
  const topProb = picks
    .filter(p => P(p) != null && !idsConSenal.has(p.local + "|" + p.visitante + "|" + p.fecha))
    .sort((a, b) => P(b) - P(a))
    .slice(0, 5);
  const topProbHtml = topProb.length === 0
    ? '<div class="empty">Sin datos suficientes todavía.</div>'
    : topProb.map(p => {
        const resultado = resultKey ? p[resultKey] : null;
        const resultadoHtml = resultado === true
          ? `<div class="conf-prob" style="color:var(--win);font-size:15px;">✓ Ganada</div>`
          : resultado === false
          ? `<div class="conf-prob" style="color:var(--loss);font-size:15px;">✕ Perdida</div>`
          : `<div class="conf-prob">${(P(p)*100).toFixed(0)}%</div>`;
        return `
        <div class="conf-card">
          <div>
            <div class="conf-teams">${p.local} vs ${p.visitante}</div>
            <div class="conf-liga">${p.liga || ""} · ${diaBadge(p)}${mercadoKey === 'btts' ? vipNotaBtts(p) : ''}${respaldoBadge(p)}${confirmacionCuotaBadge(p, mercadoKey)}${notaLigaConfianza(p)}${mercadoKey === 'ht05' ? notaOver15Ht(p) : ''}${mercadoKey === 'btts' ? notaRescateBtts(p) : ''}${mercadoKey === 'o25' ? notaRescateO25(p) : ''}${mercadoKey === 'o15' ? notaRescateO15(p) : ''}${mercadoKey === 'ht05' ? notaRescateHt05(p) : ''}${mercadoKey === 'btts' ? notaBttsMinAlto(p) : ''}</div>
            ${badgesExtra(p)}
          </div>
          <div class="conf-tier">
            <div class="conf-tier-val" style="color:var(--chalk-dim);font-size:12px;">${p[tierKey] || "sin señal formal"}</div>
            <div class="conf-cuota">cuota ${p[cuotaKey] ? p[cuotaKey].toFixed(2) : "—"}${edgeTxt(P(p), p[cuotaKey])}${mercadoKey === "btts" ? mejorCasaBadge(p, "btts") : (mercadoKey === "o25" ? mejorCasaBadge(p, "o25") : "")}</div>
          </div>
          ${resultadoHtml}
        </div>`;
      }).join("");

  // Ordenados de MAYOR a MENOR probabilidad. Los que no tienen
  // probabilidad calculada (s/d) van al final, no revueltos en el medio.
  const picksOrdenados = [...picks].sort((a, b) => {
    const pa = P(a), pb = P(b);
    if(pa == null && pb == null) return 0;
    if(pa == null) return 1;
    if(pb == null) return -1;
    return pb - pa;
  });

  const todosHtml = picksOrdenados.length === 0
    ? '<div class="empty">Todavía no hay partidos analizados hoy.</div>'
    : '<div class="match-list">' + picksOrdenados.map(p => {
        const prob = P(p);
        const cuotaTxt = p[cuotaKey] ? p[cuotaKey].toFixed(2) : "—";
        const pctT = prob != null ? `${(prob*100).toFixed(0)}%` : "s/d";
        const resultado = resultKey ? p[resultKey] : null;
        let badgeClass, badgeTxt;
        if(resultado === true){ badgeClass = "ganada"; badgeTxt = "✓ Ganada"; }
        else if(resultado === false){ badgeClass = "perdida"; badgeTxt = "✕ Perdida"; }
        else {
          // CORREGIDO 17 ago 2026: antes mostraba "Si/No" solo por
          // probabilidad >=50%, sin importar la señal real del sistema
          // (senalKey / JUGAR-EVITAR) - con reglas cada vez mas
          // especificas (que no dependen solo de probabilidad alta, sino
          // de condiciones puntuales como cuota+fallo%), esto podia
          // mostrar "No" en un partido que el sistema SI jugaria, o "Si"
          // en uno que el sistema descarta. Ahora usa la señal real.
          const senalReal = p[senalKey];
          if(senalReal === "JUGAR"){ badgeClass = "si"; badgeTxt = "JUGAR"; }
          else if(senalReal === "EVITAR"){ badgeClass = "no"; badgeTxt = "Evitar"; }
          else { badgeClass = ""; badgeTxt = "Sin datos"; }
        }
        const tierTxt = (p[tierKey] && p[tierKey] !== "Evitar") ? `<span style="color:var(--amber);">${p[tierKey]}</span> · ` : "";
        return `
          <div class="match-row">
            <div>
              <div class="match-teams">${p.local} vs ${p.visitante}</div>
              <div class="match-liga">${tierTxt}${p.liga || ""} · ${diaBadge(p)}${mercadoKey === 'btts' ? vipNotaBtts(p) : ''}${respaldoBadge(p)}${confirmacionCuotaBadge(p, mercadoKey)}${notaLigaConfianza(p)}${mercadoKey === 'ht05' ? notaOver15Ht(p) : ''}${mercadoKey === 'btts' ? notaRescateBtts(p) : ''}${mercadoKey === 'o25' ? notaRescateO25(p) : ''}${mercadoKey === 'o15' ? notaRescateO15(p) : ''}${mercadoKey === 'ht05' ? notaRescateHt05(p) : ''}${mercadoKey === 'btts' ? notaBttsMinAlto(p) : ''}</div>
              ${badgesExtra(p)}
            </div>
            <span class="match-pct">cuota ${cuotaTxt} · ${pctT}${edgeTxt(prob, p[cuotaKey])}</span>
            <span class="match-badge ${badgeClass}">${badgeTxt}</span>
          </div>`;
      }).join("") + '</div>';

  return `
    <section>
      <p class="section-title">${separaVip ? "💎 Picks del Día — Selección VIP" : "✅ Picks del Día"}</p>
      ${validadasHtml}
    </section>
    <!-- 18 oct 2026: la seccion "En seguimiento" se quito de la vista: solo se
         muestra como JUGAR lo que esta activo y estable (ver esValidadaReal). -->
    <section>
      <p class="section-title">🔝 Mayor probabilidad</p>
      ${topProbHtml}
    </section>
    <section>
      <p class="section-title">Todos los partidos analizados — ${resultadoDeseado}</p>
      ${todosHtml}
    </section>`;
}

function renderCombo(picks){
  const elegibles = picks.filter(p => p.senal_btts_o25 && p.senal_btts_o25 !== "—");
  // AGREGADO 23 ago 2026: antes, si NINGUN partido era elegible, la
  // pestaña entera mostraba un solo mensaje vacio y las secciones de
  // Validadas/En seguimiento/Todos los partidos ni se dibujaban - eso
  // ocultaba tambien "Todos los partidos analizados", que deberia
  // mostrar TODO lo evaluado (elegible o no), igual que hacen BTTS/
  // Over1.5/Over2.5/1er tiempo. Se separa: el mensaje corto solo
  // reemplaza Validadas/En seguimiento cuando no hay elegibles, pero
  // Todos los partidos se construye siempre con la lista completa.
  // CORREGIDO 29 oct 2026: el descuento ya no es 0.275. Se lee de dashboard_data.json
  // (lo escribe backtest.py a partir de reglas_activas.PRECIOS_REALES_COMBINADA: ~0.48,
  // medido con precios reales de la casa del usuario). 0.48 solo es el respaldo si el
  // JSON viejo todavia no trae el campo.
  const DESCUENTO_CORRELACION = (DATA && DATA.descuento_combo_supuesto != null) ? DATA.descuento_combo_supuesto : 0.48;
  const NUM_PRECIOS_REALES = (DATA && DATA.descuento_combo_n_precios) ? DATA.descuento_combo_n_precios : null;
  const probDe = (p) => p.prob_combo_calibrada != null ? p.prob_combo_calibrada
                       : (p.prob_combo_v2 != null ? p.prob_combo_v2 : null);
  const fila = (p) => {
    const cuotaProducto = (p.cuota_btts && p.cuota_o25) ? (p.cuota_btts * p.cuota_o25) : null;
    const cuotaCombo = cuotaProducto ? (1 + (cuotaProducto - 1) * (1 - DESCUENTO_CORRELACION)).toFixed(2) : "—";
    // 29 oct 2026: cuota MINIMA de la combinada. La cuota de arriba es una
    // ESTIMACION (la casa no la publica en FootyStats). Con el historial de esta
    // señal se calcula cuanto tendria que pagar la casa para que su ROI sea 0:
    // si tu casa paga menos que esto, esta señal pierde dinero.
    const fBE = (DATA && DATA.combo_factor_equilibrio) ? DATA.combo_factor_equilibrio[p.motivo_combo] : null;
    const cuotaMin = (cuotaProducto && fBE != null) ? (1 + (cuotaProducto - 1) * fBE) : null;
    const minTxt = cuotaMin ? ` <span title="Cuota mínima de la combinada para que esta señal no pierda dinero según su propio historial. La cuota ${cuotaCombo} es una ESTIMACIÓN (producto de las dos cuotas con un descuento de ${(DESCUENTO_CORRELACION*100).toFixed(0)}% sobre la ganancia${NUM_PRECIOS_REALES ? `, medido con ${NUM_PRECIOS_REALES} precios reales de tu casa` : ''}), no la de tu casa: si tu casa paga menos que ${cuotaMin.toFixed(2)}, no la juegues." style="color:var(--amber);">(mín. ${cuotaMin.toFixed(2)})</span>` : "";
    const resultado = p.resultado_combo;
    let badgeClass, badgeTxt;
    if(resultado === true){ badgeClass = "ganada"; badgeTxt = "✓ Ganada"; }
    else if(resultado === false){ badgeClass = "perdida"; badgeTxt = "✕ Perdida"; }
    else { badgeClass = p.senal_btts_o25 === 'VIP' ? 'si' : 'no'; badgeTxt = p.senal_btts_o25 === 'VIP' ? 'VIP' : (p.senal_btts_o25 || 'Sin datos'); }
    const motivo = ETIQUETAS_COMBO[p.motivo_combo] ? ` · <span style="color:var(--amber);">${ETIQUETAS_COMBO[p.motivo_combo]}</span>` : (p.motivo_combo && p.motivo_combo !== "ninguno_evitar_combo" ? ` · <span style="color:var(--amber);">${p.motivo_combo}</span>` : "");
    const probCombo = probDe(p);
    const probTxt = probCombo != null ? ` · ${(probCombo*100).toFixed(0)}%` : "";
    return `
      <div class="match-row">
        <div>
          <div class="match-teams">${p.local} vs ${p.visitante}</div>
          <div class="match-liga">${p.liga || ""} · ${diaBadge(p)}${respaldoBadge(p)}${notaLigaConfianza(p)}${motivo}</div>
        </div>
        <span class="match-pct">cuota ${cuotaCombo}${minTxt} · ${badgeTxt}${probTxt}</span>
        <span class="match-badge ${badgeClass}">${badgeTxt}</span>
      </div>`;
  };
  const validadas = elegibles.filter(p => esValidadaReal(p.motivo_combo));
  const enSeguimiento = elegibles.filter(p => !esValidadaReal(p.motivo_combo));
  const bloque = (lista, vacioTxt) => lista.length === 0
    ? `<div class="empty">${vacioTxt}</div>`
    : '<div class="match-list">' + lista.map(fila).join("") + '</div>';

  // "Todos los partidos analizados": TODOS los picks, elegibles o no,
  // ordenados de mayor a menor probabilidad (mismo criterio que los
  // demas mercados) - los sin probabilidad calculada van al final.
  const picksOrdenados = [...picks].sort((a, b) => {
    const pa = probDe(a), pb = probDe(b);
    if(pa == null && pb == null) return 0;
    if(pa == null) return 1;
    if(pb == null) return -1;
    return pb - pa;
  });
  const todosHtml = bloque(picksOrdenados, "Todavía no hay partidos analizados hoy.");

  return `
    <section>
      <p class="section-title">✅ Picks del Día</p>
      ${bloque(validadas, "Sin señales validadas hoy todavía.")}
    </section>
    <section>
      <p class="section-title">🔍 En seguimiento</p>
      ${bloque(enSeguimiento, "Nada en seguimiento hoy.")}
    </section>
    <section>
      <p class="section-title">Todos los partidos analizados — ¿BTTS + Over 2.5 a la vez?</p>
      ${todosHtml}
    </section>`;
}

function renderHt15Nota(picks){

  const filas = conProb.map(p => {

function renderBars(dictHist, orden, etiquetas){
  etiquetas = etiquetas || {};
  let nombres = orden.filter(n => dictHist[n] && (dictHist[n].total_detectado ?? nOf(dictHist[n])) > 0);
  if(nombres.length === 0) return '<div class="empty">Sin datos todavía en esta sección.</div>';
  // AGREGADO 24 ago 2026: ordenar por ROI% o por unidades ganadas
  // (profit_u), segun lo elegido en el selector - de mayor a menor en
  // ambos casos. Las señales sin resultado (sin partidos jugados aun)
  // se van al final, ya que no tienen ROI/unidades que comparar.
  nombres = [...nombres].sort((a, b) => {
    const sa = dictHist[a], sb = dictHist[b];
    const naA = nOf(sa) === 0, naB = nOf(sb) === 0;
    if(naA && naB) return 0;
    if(naA) return 1;
    if(naB) return -1;
    if(ORDEN_DETALLE === "estable"){
      return puntajeEstable(sb) - puntajeEstable(sa);
    }
    if(ORDEN_DETALLE === "unidades"){
      return (sb.profit_u ?? 0) - (sa.profit_u ?? 0);
    }
    const roiA = nOf(sa) > 0 ? (sa.profit_u ?? 0) / nOf(sa) : 0;
    const roiB = nOf(sb) > 0 ? (sb.profit_u ?? 0) / nOf(sb) : 0;
    return roiB - roiA;
  });
  return '<div class="bars">' + nombres.map(nombre => {
    const st = dictHist[nombre];
    const apagada = (nombre in REGLAS_ACTIVAS_REAL) && REGLAS_ACTIVAS_REAL[nombre] === false;
    const textoLabel = (etiquetas[nombre] || nombre) + (apagada ? ' <span style="color:var(--loss);font-size:0.85em;">· apagada</span>' : '');
    const totalDetectado = st.total_detectado ?? nOf(st);
    const pendientes = totalDetectado - nOf(st);
    const notaPend = pendientes > 0 ? ` <span style="color:var(--chalk-dim);">(+${pendientes} pend.)</span>` : "";
    if(nOf(st) === 0){
      return `<div class="bar-row"><span class="bar-label">${textoLabel}</span><div class="bar-track"></div><span class="bar-num">sin resultado${notaPend}</span></div>`;
    }
    const pct = st.acierto_pct ?? 0;
    const cls = statusClass(st);
    // AGREGADO 22 ago 2026: antes esta barra solo mostraba % de acierto -
    // con tantas señales nuevas hoy, cada una con su propio ROI real
    // (no siempre correlacionado con el % de acierto, como vimos varias
    // veces - una señal puede acertar mucho y perder plata si la cuota
    // es muy corta), hacia falta ver el ROI aqui mismo, no solo en el
    // resumen general del mercado.
    const roiTxt = (st.profit_u != null && nOf(st) > 0)
      ? ` · <span style="color:${st.profit_u >= 0 ? 'var(--win)' : 'var(--loss)'};">${st.profit_u >= 0 ? '+' : ''}${st.profit_u.toFixed(1)}u (${(st.profit_u/nOf(st)*100).toFixed(0)}%)</span>`
      : "";
    const recTxt = (st.roi_mitad2 != null && !isNaN(st.roi_mitad2))
      ? ` · <span title="ROI de la mitad MÁS RECIENTE de las apuestas de esta señal (la otra mitad es la más antigua). Es descriptivo: en la prueba del 30 oct no sirvió para predecir los resultados siguientes." style="color:${st.roi_mitad2 >= 0 ? 'var(--win)' : 'var(--loss)'};opacity:0.85;">reciente ${st.roi_mitad2 >= 0 ? '+' : ''}${st.roi_mitad2.toFixed(0)}%</span>`
      : "";
    return `<div class="bar-row"><span class="bar-label">${textoLabel}</span><div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div><span class="bar-num">${pctTxt(st, true)}${roiTxt}${recTxt}${notaPend}</span></div>`;
  }).join("") + '</div>';
}

function renderCalibracion(calibracion){
  const mercados = Object.keys(calibracion || {}).filter(m => calibracion[m] && calibracion[m].length > 0);
  if(mercados.length === 0) return '<div class="empty">Todavía no hay suficientes datos para medir la calibración (necesita partidos ya jugados con probabilidad calculada).</div>';

  return mercados.map(mercado => {
    const filas = calibracion[mercado].map(b => {
      const diff = b.diferencia;
      const emoji = Math.abs(diff) <= 5 ? "✅" : (diff < -5 ? "⚠️" : "💪");
      const diffTxt = (diff >= 0 ? "+" : "") + diff.toFixed(0) + "pp";
      return `
        <tr>
          <td class="name">${emoji} ${b.rango}</td>
          <td class="num">${b.total}</td>
          <td class="num">${b.acierto_pct.toFixed(0)}%</td>
          <td class="num">${diffTxt}</td>
        </tr>`;
    }).join("");
    return `
      <p class="bar-label" style="margin:16px 0 8px;">${mercado}</p>
      <table class="cmp-table">
        <thead><tr><th>Dijimos</th><th class="num">n</th><th class="num">Acertó</th><th class="num">Diferencia</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>`;
  }).join("");
}

function renderMovimientoLista(picksRecientes, umbral){
  // Lista, partido por partido, de todas las señales JUGAR (en cualquiera
  // de los 3 mercados) que tuvieron +4pp de movimiento - para que quede
  // un registro navegable de CUALES fueron, no solo el numero agregado.
  const combos = [
    ["btts", "movimiento_btts_pp", "nivel_final", "senal_btts_optimizada", "resultado_btts", "Ambos Marcan"],
    ["o15", "movimiento_o15_pp", "sug_o15", "senal_o15_tier", "resultado_o15", "Over 1.5"],
    ["o25", "movimiento_o25_pp", "sug_o25", "senal_o25", "resultado_o25", "Over 2.5"],
  ];
  const encontrados = [];
  picksRecientes.forEach(p => {
    combos.forEach(([key, movKey, señalKey, tierKey, resKey, nombreMercado]) => {
      const mov = p[movKey];
      if(mov != null && mov >= umbral && p[señalKey] === "JUGAR"){
        encontrados.push({p, mov, tier: p[tierKey], resultado: p[resKey], mercado: nombreMercado});
      }
    });
  });
  if(encontrados.length === 0){
    return '<div class="empty">Todavía no hay partidos individuales con +4pp de movimiento en el historial reciente.</div>';
  }
  encontrados.sort((a,b) => (b.p.fecha_partido || "").localeCompare(a.p.fecha_partido || ""));
  return '<div class="picks">' + encontrados.map(e => {
    let resClass = "pending", resTxt = "?";
    if(e.resultado === true){ resClass = "win"; resTxt = "✓"; }
    else if(e.resultado === false){ resClass = "loss"; resTxt = "✕"; }
    const fecha = (e.p.fecha_partido || e.p.fecha || "").split(" ")[0].slice(5);
    return `<div class="pick"><span class="pick-date">${fecha}</span><span class="pick-teams">${e.p.local} vs ${e.p.visitante} <span style="color:var(--chalk-dim);">(${e.mercado})</span></span><span class="pick-tier">+${e.mov.toFixed(1)}pp</span><span class="pick-result ${resClass}">${resTxt}</span></div>`;
  }).join("") + '</div>';
}

function renderPorLiga(porLiga){

    return '<div class="empty">Todavía no hay suficiente muestra por liga (mínimo 3 partidos jugados por liga).</div>';
  }
  // Ordenado de MAYOR a MENOR acierto (el backend las manda de peor a
  // mejor) - se ordena aqui mismo en el navegador para no depender de
  // resetear pendientes solo por un cambio de orden visual.
  const ordenadas = [...porLiga].sort((a, b) => b.acierto_pct - a.acierto_pct);
  const filas = ordenadas.map((l, i) => {
    const cls = l.profit_u >= 0 ? "win" : "loss";
    return `
      <tr class="${i%2? 'row-alt':''}">
        <td class="name"><span class="ticket-status ${cls}"></span>${l.liga}</td>
        <td class="num">${l.total}</td>
        <td class="num">${l.acierto_pct.toFixed(0)}% (${l.ganados}/${l.total})</td>
        <td class="num">${l.profit_u >= 0 ? "+" : ""}${l.profit_u.toFixed(1)}u</td>
      </tr>`;
  }).join("");
  return `<table class="cmp-table"><thead><tr><th>Liga</th><th class="num">n</th><th class="num">Acierto BTTS</th><th class="num">Unidades</th></tr></thead><tbody>${filas}</tbody></table>`;
}

// AGREGADO 19 oct 2026: partidos de las señales APAGADAS en prueba. Las
// Estadisticas cuentan a cada señal en prueba, pero esos partidos no siempre
// estan en las listas normales (que solo muestran JUGAR activos y estables),
// asi que aqui se listan TODOS los que le aplican, pendientes primero.
function tagsEnPrueba(p){
  return String(p.motivos_btts_todos || "").split("|").filter(t => SENALES_EN_PRUEBA.has(t));
}
function nombreCortoPrueba(t){ return (ETIQUETAS_BTTS[t] || t).split(" · ")[0]; }
function nombreCompletoPrueba(t){ return ETIQUETAS_BTTS[t] || t; }
function renderPartidosEnPrueba(data){
  const vistos = new Set(), todos = [];
  for(const p of [...(data.picks_hoy || []), ...(data.picks_recientes || [])]){
    const k = [p.fecha_partido || p.fecha, p.local, p.visitante].join("|");
    if(vistos.has(k)) continue; vistos.add(k); todos.push(p);
  }
  const porSenal = {};
  for(const p of todos) for(const t of tagsEnPrueba(p)) (porSenal[t] = porSenal[t] || []).push(p);
  const claves = Object.keys(porSenal);
  if(claves.length === 0){
    return `<section><p class="section-title">🔬 Partidos de las señales en prueba</p><div class="empty">Ningún partido reciente cumple todavía una señal en prueba. Si las Estadísticas muestran casos, falta actualizar backtest.py (campo motivos_btts_todos).</div></section>`;
  }
  claves.sort((a, b) => porSenal[b].length - porSenal[a].length);
  const fechaDe = p => String(p.fecha_partido || p.fecha || "").split(" ")[0];
  const bloques = claves.map(t => {
    const lista = porSenal[t].slice().sort((a, b) => {
      const pa = a.resultado_btts === true || a.resultado_btts === false ? 1 : 0;
      const pb = b.resultado_btts === true || b.resultado_btts === false ? 1 : 0;
      if(pa !== pb) return pa - pb;                       // pendientes primero
      return fechaDe(b).localeCompare(fechaDe(a));         // luego los mas recientes
    }).slice(0, 12);
    const res = porSenal[t].filter(p => p.resultado_btts === true || p.resultado_btts === false);
    const gan = res.filter(p => p.resultado_btts === true).length;
    const pend = porSenal[t].length - res.length;
    const filas = lista.map(p => {
      let cls = "pending", txt = "?";
      if(p.resultado_btts === true){ cls = "win"; txt = "✓"; } else if(p.resultado_btts === false){ cls = "loss"; txt = "✕"; }
      const cuota = p.cuota_btts != null ? Number(p.cuota_btts).toFixed(2) : "—";
      const decision = p.nivel_final === "JUGAR" ? "JUGAR" : "no se juega";
      const real = p.motivo_btts && p.motivo_btts !== "ninguno_evitar_final" ? ` · ${nombreCortoPrueba(p.motivo_btts)}` : "";
      return `<div class="pick"><span class="pick-date">${fechaDe(p).slice(5)}</span><span class="pick-teams">${p.local} vs ${p.visitante}</span><span class="pick-tier" title="cuota ${cuota}">${cuota} · ${decision}${real}</span><span class="pick-result ${cls}">${txt}</span></div>`;
    }).join("");
    return `<div style="margin-bottom:18px;"><p class="bar-label" style="margin-bottom:8px;">${nombreCompletoPrueba(t)} <span style="opacity:0.7;font-weight:normal;">— ${gan}/${res.length} aciertos · ${pend} pendientes</span></p><div class="picks">${filas}</div></div>`;
  }).join("");
  return `<section><p class="section-title">🔬 Partidos de las señales en prueba (apagadas)</p><p class="bar-label" style="opacity:0.7;font-weight:normal;margin-bottom:12px;">Todos los partidos recientes que cumplen cada señal, se jueguen o no. "no se juega" = la decisión real del sistema fue otra y este partido no recibe alerta.</p>${bloques}</section>`;
}

// Toda la medicion llega calculada en dashboard_data.json -> "vip_btts"
// (backtest._vip_btts_datos); aqui solo se muestra. La regla que decide quien
// entra a la seleccion vive en reglas_activas.clasificar_vip_btts (Python) y
// cada pick ya trae su clase en p.vip_btts ("RESPALDADA", "ZONA_VALOR" o null).
const MESES_ES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_ES_LARGO = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const VIP_CLASES = {
  RESPALDADA: {nombre: "Respaldada", chip: "💎 VIP · RESPALDADA", fuerte: true},
  ZONA_VALOR: {nombre: "Zona de valor", chip: "💎 VIP · ZONA DE VALOR", fuerte: false},
};
// Colores de las 2 lineas de la curva: casillas 1 y 2 de la paleta categorica
// validada para fondo oscuro (separacion para daltonismo y contraste >=3:1
// contra el fondo de la tarjeta, verificado con validate_palette.js).
const VIP_COLOR_VIP = "#3987e5";
const VIP_COLOR_TODAS = "#d95926";
let VIP_CURVA = null;

function vipEsc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function vipPol(){ return (DATA && DATA.vip_btts && DATA.vip_btts.politica) || {}; }
function vipActiva(){ return !!(DATA && DATA.vip_btts && DATA.vip_btts.politica && !DATA.vip_btts.error && !DATA.vip_btts.vacio); }
function vipClase(p){ return (p && VIP_CLASES[p.vip_btts]) ? p.vip_btts : null; }
function vipFmt(x, nd, signo){
  if(x == null || isNaN(x)) return "—";
  nd = (nd == null) ? 1 : nd;
  const s = Math.abs(x).toFixed(nd);
  const esCero = Number(s) === 0;
  if(x < 0 && !esCero) return "-" + s;
  return (signo !== false && x > 0 && !esCero ? "+" : "") + s;
}
function vipPct(x){ return x == null ? "—" : vipFmt(x, 1) + "%"; }
function vipCol(x){ return (x == null || x === 0) ? "var(--chalk)" : (x > 0 ? "var(--win)" : "var(--loss)"); }
function vipN(x){
  if(x == null || isNaN(x)) return "—";
  const s = String(Math.round(Number(x)));
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f");
}
function vipFechaCorta(f){
  if(!f) return "—";
  const p = String(f).split("-");
  return p.length === 3 ? (parseInt(p[2], 10) + " " + MESES_ES[parseInt(p[1], 10) - 1]) : f;
}
function vipMesNombre(ym){
  const p = String(ym || "").split("-");
  return p.length === 2 ? MESES_ES_LARGO[parseInt(p[1], 10) - 1] : (ym || "");
}
function vipOrden(a, b){
  const pr = (p) => p.vip_btts === "RESPALDADA" ? 0 : (p.vip_btts === "ZONA_VALOR" ? 1 : 2);
  if(pr(a) !== pr(b)) return pr(a) - pr(b);
  const pa = a.prob_btts_calibrada != null ? a.prob_btts_calibrada : (a.prob_btts || 0);
  const pb = b.prob_btts_calibrada != null ? b.prob_btts_calibrada : (b.prob_btts || 0);
  return pb - pa;
}

// Etiqueta corta para las tarjetas del mercado Ambos Marcan.

      : `Zona de valor: cuota entre ${Number(pol.cuota_min).toFixed(2)} y ${Number(pol.cuota_max).toFixed(2)}, donde la casa se queda menos. Ver pestaña Selección VIP.`;
    const enviado = p.alerta_btts ? ' · <span title="Esta alerta ya salió al Telegram" style="color:var(--chalk-dim);">📨 enviado</span>' : "";
    return ` · <span class="vip-chip ${info.fuerte ? "fuerte" : ""}" title="${vipEsc(titulo)}">${info.chip}</span>${enviado}`;

}

function vipSemaforo(L, mercadoRoi){
  const n = (L && L.n) || 0;

  return {cls: "mal", txt: `Va peor que un partido cualquiera con ${n} apuestas: revisar la regla`};
}

// Ticks "redondos" (1, 2, 5, 10 x potencia de 10) para el eje de unidades.
function vipTicks(lo, hi){
  const span = Math.max(hi - lo, 1e-9);
  const raw = span / 5;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / pow;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * pow;
  const t0 = Math.floor(lo / step + 1e-9) * step, t1 = Math.ceil(hi / step - 1e-9) * step;
  const ticks = [];
  for(let v = t0; v <= t1 + step * 1e-6; v += step) ticks.push(Math.round(v * 1000) / 1000);
  return {ticks, lo: ticks[0], hi: ticks[ticks.length - 1]};
}

// Curva de ganancia acumulada (unidades): Seleccion VIP contra todas las JUGAR.
// En pantallas angostas se usa un lienzo mas chico (textos mas grandes al escalar) y
// solo el valor al final de cada linea; el nombre va en la leyenda de arriba.
function vipEsMovil(){ return window.innerWidth < 620; }
function vipCurvaSvg(curva){
  VIP_CURVA = null;
  if(!curva || curva.length < 2) return '<div class="empty">Todavía no hay suficientes días para dibujar la curva.</div>';
  const movil = vipEsMovil();
  const W = movil ? 380 : 760, H = movil ? 290 : 300;
  const ml = movil ? 38 : 46, mr = movil ? 60 : 132, mt = 14, mb = 30;
  const fs = movil ? 12 : 11;
  const iw = W - ml - mr, ih = H - mt - mb;
  const t = curva.map(c => Date.parse(c.fecha + "T00:00:00Z"));
  const t0 = t[0], t1 = t[t.length - 1];
  const xs = t.map(v => ml + (t1 === t0 ? 0 : iw * (v - t0) / (t1 - t0)));
  const SER = [
    {k: "vip", nombre: "Selección VIP", color: VIP_COLOR_VIP},
    {k: "todas", nombre: "Todas las JUGAR", color: VIP_COLOR_TODAS},
  ];
  const vals = [];
  curva.forEach(c => { SER.forEach(s => vals.push(c[s.k])); });
  const tk = vipTicks(Math.min(0, ...vals), Math.max(0, ...vals));
  const yv = (v) => mt + ih * (1 - (v - tk.lo) / (tk.hi - tk.lo));
  const ys = SER.map(s => curva.map(c => yv(c[s.k])));

  let g = "";
  tk.ticks.forEach(v => {
    const y = yv(v);
    g += `<line x1="${ml}" x2="${W - mr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${v === 0 ? "var(--chalk-dim)" : "var(--line)"}" stroke-width="1" ${v === 0 ? 'stroke-opacity="0.55"' : ""}/>`;
    g += `<text x="${ml - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="var(--chalk-dim)" font-size="${fs}" font-family="var(--mono)">${vipFmt(v, 0)}</text>`;
  });
  // meses en el eje X (primer dato de cada mes); si dos quedan muy pegados se omite la primera
  const mesesX = [];
  let mesPrev = "";
  curva.forEach((c, i) => {
    const ym = c.fecha.slice(0, 7);
    if(ym !== mesPrev){ mesPrev = ym; mesesX.push({x: xs[i], txt: MESES_ES[parseInt(ym.slice(5, 7), 10) - 1], ini: i === 0}); }
  });
  const minGap = movil ? 46 : 40;
  mesesX.forEach((m, k) => {
    const sig = mesesX[k + 1];
    if(sig && sig.x - m.x < minGap) return;
    g += `<text x="${m.x.toFixed(1)}" y="${H - 8}" text-anchor="${m.ini ? "start" : "middle"}" fill="var(--chalk-dim)" font-size="${fs}" font-family="var(--mono)">${m.txt}</text>`;
  });
  // lineas (2px, extremos redondeados)
  SER.forEach((s, j) => {
    const d = curva.map((c, i) => (i ? "L" : "M") + xs[i].toFixed(1) + " " + ys[j][i].toFixed(1)).join(" ");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  // puntos finales con anillo del color de la superficie + etiquetas directas
  const last = curva.length - 1;
  const lx = xs[last] + 12;
  let ly = SER.map((s, j) => ys[j][last]);
  const sep = movil ? 18 : 34;
  const hayChoque = Math.abs(ly[0] - ly[1]) < sep;
  if(hayChoque){
    const mid = (ly[0] + ly[1]) / 2;
    const arriba = ly[0] <= ly[1] ? 0 : 1;
    ly = ly.slice();
    ly[arriba] = mid - sep / 2;
    ly[1 - arriba] = mid + sep / 2;
  }
  SER.forEach((s, j) => {
    const cy = ys[j][last];
    if(hayChoque) g += `<line x1="${xs[last].toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(lx - 3).toFixed(1)}" y2="${ly[j].toFixed(1)}" stroke="${s.color}" stroke-width="1"/>`;
    g += `<circle cx="${xs[last].toFixed(1)}" cy="${cy.toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--pitch-800)" stroke-width="2"/>`;
    if(movil){
      g += `<text x="${lx.toFixed(1)}" y="${(ly[j] + 4).toFixed(1)}" fill="var(--chalk)" font-size="13" font-weight="700" font-family="var(--sans)">${vipFmt(curva[last][s.k], 1)}u</text>`;
    } else {
      g += `<text x="${lx.toFixed(1)}" y="${(ly[j] - 2).toFixed(1)}" fill="var(--chalk-dim)" font-size="11" font-family="var(--mono)">${s.nombre}</text>`;
      g += `<text x="${lx.toFixed(1)}" y="${(ly[j] + 14).toFixed(1)}" fill="var(--chalk)" font-size="14" font-weight="700" font-family="var(--sans)">${vipFmt(curva[last][s.k], 1)}u</text>`;
    }
  });
  // capa de hover: linea vertical + puntos que siguen al puntero
  g += `<line id="vipCross" x1="0" x2="0" y1="${mt}" y2="${H - mb}" stroke="var(--chalk-dim)" stroke-width="1" style="display:none;"/>`;
  SER.forEach((s, j) => { g += `<circle id="vipDot${j}" r="4.5" fill="${s.color}" stroke="var(--pitch-800)" stroke-width="2" style="display:none;"/>`; });
  g += `<rect x="${ml}" y="0" width="${iw + 12}" height="${H}" fill="transparent" style="cursor:crosshair;"/>`;

  VIP_CURVA = {W, H, xs, ys, curva, series: SER, movil};
  const resumenAria = `Ganancia acumulada en unidades desde ${curva[0].fecha} hasta ${curva[last].fecha}. Selección VIP: ${vipFmt(curva[last].vip, 1)} unidades. Todas las JUGAR: ${vipFmt(curva[last].todas, 1)} unidades.`;
  return `<div class="vip-chart">
    <svg id="vipCurva" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${vipEsc(resumenAria)}">${g}</svg>
    <div class="vip-tip" id="vipTip"></div>
  </div>`;
}

// Conecta el crosshair + tooltip (se llama despues de pintar la pagina).
function vipInitCurva(){
  const svg = document.getElementById("vipCurva");
  const tip = document.getElementById("vipTip");
  const G = VIP_CURVA;
  if(!svg || !tip || !G) return;
  const cross = svg.querySelector("#vipCross");
  const dots = G.series.map((_, j) => svg.querySelector("#vipDot" + j));
  let idx = G.curva.length - 1;
  const ocultar = () => { tip.style.display = "none"; cross.style.display = "none"; dots.forEach(d => { d.style.display = "none"; }); };
  const mostrar = (i) => {
    idx = Math.max(0, Math.min(G.curva.length - 1, i));
    const c = G.curva[idx];
    cross.setAttribute("x1", G.xs[idx]); cross.setAttribute("x2", G.xs[idx]); cross.style.display = "";
    G.series.forEach((s, j) => { dots[j].setAttribute("cx", G.xs[idx]); dots[j].setAttribute("cy", G.ys[j][idx]); dots[j].style.display = ""; });
    tip.textContent = "";
    const f = document.createElement("div"); f.className = "f";
    f.textContent = vipFechaCorta(c.fecha) + " " + c.fecha.slice(0, 4);
    tip.appendChild(f);
    G.series.forEach(s => {
      const r = document.createElement("div"); r.className = "r";
      const k = document.createElement("span"); k.className = "k"; k.style.borderTopColor = s.color; r.appendChild(k);
      const n = document.createElement("span"); n.textContent = s.nombre; r.appendChild(n);
      const b = document.createElement("b"); b.textContent = vipFmt(c[s.k], 1) + "u"; r.appendChild(b);
      tip.appendChild(r);
    });
    tip.style.display = "block";
    const rect = svg.getBoundingClientRect();
    const escX = rect.width / G.W, escY = rect.height / G.H;
    const px = G.xs[idx] * escX;
    const wT = tip.offsetWidth, hT = tip.offsetHeight;
    // 4 esquinas posibles (derecha/izquierda del cursor, arriba/abajo): gana la que menos lineas tapa
    const cands = [];
    [px + 14, px - wT - 14].forEach(l => {
      if(l < 0 || l + wT > rect.width) return;
      [6, rect.height - hT - 34 * escY].forEach(t => cands.push({l, t: Math.max(6, t)}));
    });
    if(!cands.length) cands.push({l: Math.max(0, Math.min(px + 14, rect.width - wT)), t: 6});
    const cruces = (c) => { let n = 0; G.ys.forEach((col, j) => col.forEach((yy, i) => {
      const x = G.xs[i] * escX, y = yy * escY;
      if(x > c.l - 6 && x < c.l + wT + 6 && y > c.t - 8 && y < c.t + hT + 8) n++;
    })); return n; };
    let mejor = cands[0], mejorN = Infinity;
    cands.forEach(c => { const n = cruces(c); if(n < mejorN){ mejor = c; mejorN = n; } });
    tip.style.left = mejor.l + "px";
    tip.style.top = mejor.t + "px";
  };
  const masCercano = (x) => {
    let lo = 0, hi = G.xs.length - 1;
    while(hi - lo > 1){ const m = (lo + hi) >> 1; if(G.xs[m] < x) lo = m; else hi = m; }
    return (Math.abs(G.xs[lo] - x) <= Math.abs(G.xs[hi] - x)) ? lo : hi;
  };
  const desdeEvento = (ev) => {
    const rect = svg.getBoundingClientRect();
    return masCercano((ev.clientX - rect.left) * G.W / rect.width);
  };
  svg.addEventListener("pointermove", ev => mostrar(desdeEvento(ev)));
  svg.addEventListener("pointerdown", ev => mostrar(desdeEvento(ev)));
  svg.addEventListener("pointerleave", ocultar);
  svg.addEventListener("focus", () => mostrar(idx));
  svg.addEventListener("blur", ocultar);
  svg.addEventListener("keydown", ev => {
    const paso = ev.shiftKey ? 7 : 1;
    if(ev.key === "ArrowRight"){ mostrar(idx + paso); ev.preventDefault(); }
    else if(ev.key === "ArrowLeft"){ mostrar(idx - paso); ev.preventDefault(); }
    else if(ev.key === "Home"){ mostrar(0); ev.preventDefault(); }
    else if(ev.key === "End"){ mostrar(G.curva.length - 1); ev.preventDefault(); }
    else if(ev.key === "Escape"){ ocultar(); }
  });
}

  return `<section>${titulo}
    <div class="vip-verdict" style="border-left-color:${ver.color};">
      <p style="font-size:15px;">${ver.txt}</p>
      <p class="vip-dim" style="font-size:13px;">Son las apuestas JUGAR de las señales que hoy están activas y estables (la misma regla de «activa y estable» del Telegram${(V.politica && V.politica.solo_vip_en_telegram) ? ", que además exige entrar a la Selección VIP" : ""}), de todo el histórico: del ${vipFechaCorta(ae.desde)} al ${vipFechaCorta(ae.hasta)}.</p>

// ---------- 30 oct 2026: las señales de BTTS con ROI positivo, en dos grupos (pedido del usuario) ----------
// Llega calculado en dashboard_data.json -> grupos_senales_btts (backtest._grupos_senales_datos): la misma
// cuenta de «Por qué se activó JUGAR (BTTS)», partida por mes. Periodo = mes. Grupo 1: ganaron en TODOS sus
// meses. Grupo 2: ningun mes perdido, pero con poca historia. «Sin grupo»: positivas que perdieron algun mes
// o tienen muy pocas apuestas. Solo informativo: no cambia que señales se envian.
let VIP_GR_OTRAS_ABIERTO = false;
function vipU(x){                       // unidades: 1 decimal; 2 si es distinto de cero pero redondea a 0.0
  if(x == null || isNaN(x)) return "—";
  return (x !== 0 && Math.abs(x) < 0.05) ? vipFmt(x, 2) : vipFmt(x, 1);
}
function vipEstadoSenal(est){
  if(est === "activa") return '<span style="color:var(--win);">activa</span>';
  if(est === "en_prueba") return '<span style="color:var(--amber);">en prueba<span class="vip-solo-pc"> (apagada)</span></span>';
  return '<span class="vip-dim">apagada</span>';
}
function vipGruposSenalesHtml(data){
  const titulo = '<p class="section-title">🏅 Señales de BTTS con ROI positivo · en dos grupos</p>';

  if(!G || G.error || !Array.isArray(G.meses) || !G.meses.length || !G.reglas || !Array.isArray(G.grupo1) || !Array.isArray(G.grupo2)){
    let msg;
    if(G && G.error) msg = `No se pudo calcular esta sección (${vipEsc(G.error)}).`;
    else if(G && !Array.isArray(G.meses)) msg = "Todavía no hay historial suficiente para separar las señales en grupos.";
    else msg = "Todavía no hay datos para esta sección. Sube los archivos nuevos (backtest.py e index.html) y corre el workflow una vez.";
    return `<section>${titulo}<div class="empty">${msg}</div></section>`;
  }
  const R = G.reglas, g1 = G.grupo1, g2 = G.grupo2, otras = Array.isArray(G.otras) ? G.otras : [];
  const meses = G.meses, mini = R.min_apuestas_mes, diaMin = R.min_dia_mes_en_curso || 15;
  const anios = new Set(meses.map(m => String(m).slice(0, 4)));
  const anioTxt = (ym) => (anios.size > 1 ? " " + String(ym).slice(0, 4) : "");
  const mesLargo = (ym) => vipMesNombre(ym) + anioTxt(ym);                        // "octubre" (para frases)
  const mesCorto = (ym) => {                                                      // "Oct" (para el encabezado de la tabla)
    const p = String(ym).split("-");
    const n = MESES_ES[parseInt(p[1], 10) - 1] || String(ym);
    return n.charAt(0).toUpperCase() + n.slice(1) + anioTxt(ym);
  };
  const hoyMes = (data && data.hoy_referencia) ? String(data.hoy_referencia).slice(0, 7) : "";

  // por que la señal esta en ese grupo (una frase corta, debajo del nombre)
  const razon = (f, tipo) => {
    const k = (f.meses_contados || []).length;
    if(tipo === 1) return "";                                   // ya lo dice el grupo: ganó todos sus meses
    if(tipo === 2){                                             // lo que todavia le falta para el Grupo 1
      const p = [];
      if(k < R.min_meses_grupo1) p.push(`${k} ${k === 1 ? "mes" : "meses"}`);
      if(f.n < R.min_apuestas_grupo1) p.push(`${vipN(f.n)} apuestas`);
      return p.join(" · ");
    }
    const per = f.meses_perdidos || [];
    if(per.length){
      const t = per.map(ym => `${mesLargo(ym)} (${vipU(f.meses && f.meses[ym] ? f.meses[ym].uds : null)}u)`);
      return "perdió " + (t.length > 1 ? t.slice(0, -1).join(", ") + " y " + t[t.length - 1] : t[0]);
    }
    if(f.n < R.min_apuestas_grupo2) return `solo ${vipN(f.n)} apuestas (mínimo ${R.min_apuestas_grupo2})`;
    return `ningún mes con ${mini}+ apuestas`;
  };

  const fila = (f, tipo, ocultos) => {
    const etq = (typeof ETIQUETAS_BTTS !== "undefined" && ETIQUETAS_BTTS[f.motivo]) || f.motivo;
    const corto = String(etq).split(" · ")[0];            // nombre de la señal tal como se ve en el dashboard
    const celdas = meses.map(ym => {
      const c = f.meses && f.meses[ym];
      const nc = ocultos.has(ym) ? " mes-nc" : "";
      if(!c) return `<td class="num vip-dim${nc}">—</td>`;
      const cuenta = (f.meses_contados || []).indexOf(ym) >= 0;       // la decision la toma el backend
      const roiM = c.n ? c.uds / c.n * 100 : null;
      const tip = `${vipN(c.n)} apuestas · ROI ${vipPct(roiM)}` + (cuenta ? "" : (c.n >= mini ? ` · todavía no cuenta: el mes en curso cuenta desde el día ${diaMin}` : ` · no cuenta (menos de ${mini} apuestas)`));
      return cuenta
        ? `<td class="num${nc}" style="color:${vipCol(c.uds)};font-weight:600;" title="${vipEsc(tip)}">${vipU(c.uds)}</td>`
        : `<td class="num vip-dim${nc}" title="${vipEsc(tip)}">${vipU(c.uds)}<span class="vip-nota" style="display:inline;margin-left:3px;">(${vipN(c.n)})</span></td>`;
    }).join("");
    const rz = razon(f, tipo);
    return `<tr>
      <td class="vip-nom"><span title="${vipEsc(etq)}">${vipEsc(corto)}</span><div class="vip-nota">${vipEstadoSenal(f.estado)}${rz ? " · " + vipEsc(rz) : ""}</div></td>
      <td class="num c-n">${vipN(f.n)}</td>
      <td class="num" style="color:${vipCol(f.roi)};font-weight:700;">${vipPct(f.roi)}<span class="vip-nota vip-solo-movil" style="font-weight:400;">${vipN(f.n)} ap.</span></td>
      <td class="num c-u" style="color:${vipCol(f.uds)};">${vipU(f.uds)}u</td>
      ${celdas}
    </tr>`;
  };
  const tabla = (lista, tipo) => {
    // meses en que NINGUNA fila de esta tabla llega al minimo de apuestas: en el celular se ocultan (no deciden nada)
    const ocultos = new Set(meses.filter(ym => !lista.some(f => (f.meses_contados || []).indexOf(ym) >= 0)));
    const anchoMes = (100 - 36 - 11 - 10 - 10) / meses.length;
    return `<div class="vip-scroll vip-gr"><table class="cmp-table">
      <colgroup><col style="width:36%"><col class="c-n" style="width:11%"><col style="width:10%"><col class="c-u" style="width:10%">${meses.map(ym => `<col class="${ocultos.has(ym) ? "mes-nc" : ""}" style="width:${anchoMes.toFixed(2)}%">`).join("")}</colgroup>
      <thead><tr><th>Señal</th><th class="num c-n">Apuestas</th><th class="num">ROI</th><th class="num c-u" title="Unidades ganadas o perdidas en total">Unid.</th>${meses.map(ym => `<th class="num${ocultos.has(ym) ? " mes-nc" : ""}" title="Unidades ganadas o perdidas en ${mesLargo(ym)}">${mesCorto(ym)}${ym === hoyMes ? '<div class="vip-nota">en curso</div>' : ""}</th>`).join("")}</tr></thead>
      <tbody>${lista.map(f => fila(f, tipo, ocultos)).join("")}</tbody></table></div>`;
  };
  const bloque = (icono, tit, sub, lista, tipo, vacio) => `
    <p class="bar-label" style="margin:22px 0 4px;font-size:15px;color:var(--chalk);">${icono} <b>${tit}</b> <span class="vip-dim">(${lista.length})</span></p>
    <p class="vip-dim" style="font-size:13px;margin:0 0 10px;line-height:1.5;">${sub}</p>
    ${lista.length ? tabla(lista, tipo) : `<div class="empty" style="padding:22px 16px;">${vacio}</div>`}`;

  const intro = `<div class="vip-verdict" style="border-left-color:var(--line);">
      <p><b>${vipN(G.n_positivas)} de las ${vipN(G.n_senales)} señales de BTTS tienen ROI positivo</b> (del ${vipFechaCorta(G.desde)} al ${vipFechaCorta(G.hasta)}). Se separan mes por mes: un mes cuenta solo si la señal tuvo ${mini} o más apuestas ese mes (con menos, ganar o perder es azar), y el mes en curso cuenta desde el día ${diaMin}.</p>
      <p class="vip-dim" style="font-size:13px;">Las columnas de meses son las unidades ganadas (verde) o perdidas (rojo) ese mes. En gris, con las apuestas entre paréntesis, los meses que no cuentan. Es la misma cuenta de «Por qué se activó JUGAR (BTTS)», partida por mes.</p>
    </div>`;

  const nPrueba1 = g1.filter(f => f.estado === "en_prueba").length;
  const notas = `<div class="vip-verdict" style="margin-top:16px;border-left-color:var(--line);">
      <p class="vip-dim" style="font-size:13px;">⚠️ <b>Ganar todos los meses no es una garantía.</b> Una señal sin ninguna ventaja real gana tres meses seguidos 1 de cada 6 veces. Y perder un mes no descarta a una buena: con unas 40 apuestas al mes, una señal que de verdad rinde +8% pierde 1 mes de cada 5.</p>
      ${nPrueba1 ? `<p class="vip-dim" style="font-size:13px;">${nPrueba1} de las ${g1.length} del Grupo 1 están «en prueba (apagada)»: se diseñaron mirando este mismo historial, así que su récord sale más favorable de lo que se puede esperar. Por eso el sistema no las enciende solo.</p>` : ""}
      <p class="vip-dim" style="font-size:13px;">Solo cuenta el historial real desde el ${vipFechaCorta(G.desde)} (no el reconstruido de abril-julio). Las unidades no se suman entre señales: un mismo partido cuenta en varias. Esta sección es informativa: no cambia qué señales se envían al Telegram.</p>
    </div>`;

  const detOtras = otras.length ? `<details class="vip-det" ${VIP_GR_OTRAS_ABIERTO ? "open" : ""} ontoggle="VIP_GR_OTRAS_ABIERTO = this.open">
      <summary>➖ Sin grupo (${otras.length}): ROI positivo, pero perdieron algún mes o tienen muy pocas apuestas</summary>
      <div style="margin-top:10px;">${tabla(otras, 0)}</div></details>` : "";

  return `<section>${titulo}
    ${intro}
    ${bloque("🏆", "Grupo 1 · Consolidadas", `Ganaron en <b>todos</b> sus meses (mínimo ${R.min_meses_grupo1} meses y ${R.min_apuestas_grupo1} apuestas en total).`, g1, 1, "Ninguna señal ha ganado todos sus meses todavía.")}
    ${bloque("🌱", "Grupo 2 · Con poca historia", `ROI positivo, <b>ningún mes perdido</b> y al menos ${R.min_apuestas_grupo2} apuestas, pero llevan menos de ${R.min_meses_grupo1} meses o menos de ${R.min_apuestas_grupo1} apuestas. Hay que vigilarlas antes de confiar en ellas como en el Grupo 1.`, g2, 2, "Ninguna señal está en esta situación.")}
