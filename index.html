<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReyBetIA — El Rey de Ambos Marcan</title>
<link rel="icon" href="./favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --pitch-950:#0a1f1f;
    --pitch-900:#0f2a2a;
    --pitch-800:#163a3a;
    --pitch-700:#1e4a4a;
    --line:#2b4f4f;
    --chalk:#f4f7f2;
    --chalk-dim:#b9c9bd;
    --amber:#d19a3d;
    --amber-dim:#6b4a1a;
    --win:#4cb56d;
    --win-bg:rgba(76,181,109,0.12);
    --loss:#e2564c;
    --loss-bg:rgba(226,86,76,0.12);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--pitch-800), transparent),
      repeating-linear-gradient(90deg, transparent 0 79px, rgba(244,247,242,0.025) 79px 80px),
      var(--pitch-950);
    color:var(--chalk);
    font-family:var(--sans);
    min-height:100vh;
    padding:0 0 64px;
  }
  a{color:var(--amber);}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px;}

  header.top{
    padding:28px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--line);
    margin-bottom:0;
    background: radial-gradient(ellipse 500px 200px at 50% 0%, rgba(209,154,61,0.08), transparent);
  }
  .logo-img{
    width:64px;height:64px;border-radius:50%;
    border:2px solid var(--amber-dim);
    box-shadow:0 0 24px rgba(209,154,61,0.25);
    margin-bottom:10px;
  }
  .brand{
    font-family:var(--mono);
    font-weight:700;
    font-size:24px;
    letter-spacing:.02em;
    margin:0;
  }
  .brand span{color:var(--amber);}
  .tagline{
    font-size:11px;
    color:var(--chalk-dim);
    text-transform:uppercase;
    letter-spacing:.15em;
    margin:4px 0 0;
    font-family:var(--mono);
  }
  .updated{
    font-size:11px;
    color:var(--chalk-dim);
    margin-top:8px;
    font-family:var(--mono);
  }
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--win);margin-right:6px;vertical-align:1px;
    box-shadow:0 0 8px var(--win);}

  .hero-pick{
    max-width:980px;margin:20px auto 0;padding:0 20px;
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
  }
  @media (max-width:700px){.hero-pick{grid-template-columns:1fr;}}
  .hero-pick-card{
    position:relative;
    background:linear-gradient(135deg, var(--pitch-800) 0%, var(--pitch-900) 60%);
    border:1px solid var(--amber-dim);
    border-radius:14px;
    padding:20px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    box-shadow:0 0 40px rgba(209,154,61,0.08);
  }
  .hero-pick-badge{
    font-family:var(--mono);font-size:11px;font-weight:700;
    color:var(--pitch-950);background:var(--amber);
    padding:4px 10px;border-radius:20px;letter-spacing:.05em;
    display:inline-block;margin-bottom:8px;
  }
  .hero-pick-teams{font-size:19px;font-weight:700;}
  .hero-pick-liga{font-size:12px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .hero-pick-right{text-align:right;font-family:var(--mono);}
  .hero-pick-pct{font-size:32px;font-weight:700;color:var(--amber);line-height:1;}
  .hero-pick-mkt{font-size:11px;color:var(--chalk-dim);margin-top:4px;text-transform:uppercase;letter-spacing:.05em;}
  @media (max-width:600px){.hero-pick-card{flex-direction:column;align-items:flex-start;}.hero-pick-right{text-align:left;}}

  .tabs{
    display:flex;
    overflow-x:auto;
    gap:4px;
    padding:14px 20px 0;
    border-bottom:1px solid var(--line);
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex-shrink:0;
    background:transparent;
    border:none;
    color:var(--chalk-dim);
    font-family:var(--mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:10px 16px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s;
  }
  .tab-btn:hover{color:var(--chalk);}
  .tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}
  .tab-panel{display:none;padding-top:28px;}
  .tab-panel.active{display:block;}

  .section-title{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:12px;
    color:var(--chalk-dim);
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 0 16px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}
  section{margin-bottom:40px;}

  .market-hero{text-align:center;padding:20px 0 8px;}
  .market-hero .big{
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(40px,10vw,64px);
    line-height:1;
    background:linear-gradient(180deg, var(--chalk) 0%, var(--chalk-dim) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin:0;
  }
  .market-hero .sub{font-size:13px;color:var(--chalk-dim);margin-top:6px;font-family:var(--mono);}

  .conf-card{
    position:relative;
    background:linear-gradient(160deg, var(--pitch-800), var(--pitch-900));
    border:1px solid var(--amber-dim);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:10px;
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:14px;
    align-items:center;
  }
  .conf-teams{font-weight:600;font-size:15px;}
  .conf-liga{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .conf-tier{text-align:center;font-family:var(--mono);}
  .conf-tier-val{font-weight:700;font-size:15px;color:var(--amber);}
  .conf-cuota{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);margin-top:2px;}
  .conf-prob{font-family:var(--mono);font-size:20px;font-weight:700;text-align:right;}
  @media (max-width:600px){.conf-card{grid-template-columns:1fr;text-align:left;}.conf-prob{text-align:left;}}

  .match-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .match-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:12px;
    align-items:center;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .match-row:last-child{border-bottom:none;}
  .match-row:nth-child(even){background:rgba(244,247,242,0.015);}
  .match-teams{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .match-liga{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;}
  .match-pct{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);text-align:right;white-space:nowrap;}
  .match-badge{
    font-family:var(--mono);font-size:11px;font-weight:700;
    padding:3px 10px;border-radius:20px;text-align:center;min-width:34px;
  }
  .match-badge.ganada{background:var(--win-bg);color:var(--win);}
  .match-badge.perdida{background:var(--loss-bg);color:var(--loss);}
  .match-badge.si{background:var(--win-bg);color:var(--win);}
  .match-badge.no{background:var(--loss-bg);color:var(--loss);}
  .match-badge.score{background:var(--pitch-700);color:var(--amber);min-width:44px;}

  @media (max-width:420px){
    .match-row{grid-template-columns:1fr;text-align:left;gap:6px;}
    .match-pct{text-align:left;}
  }

  .empty{text-align:center;padding:40px 20px;color:var(--chalk-dim);font-family:var(--mono);font-size:13px;}

  .tickets{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px,1fr));gap:16px;}
  .ticket{position:relative;background:var(--pitch-800);border:1px solid var(--line);border-radius:10px;padding:20px 18px 16px;}
  .ticket::before,.ticket::after{content:"";position:absolute;width:16px;height:16px;background:var(--pitch-950);border:1px solid var(--line);border-radius:50%;top:50%;transform:translateY(-50%);}
  .ticket::before{left:-9px;}
  .ticket::after{right:-9px;}
  .ticket-name{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--chalk-dim);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .ticket-status{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .ticket-status.win{background:var(--win);box-shadow:0 0 6px var(--win);}
  .ticket-status.loss{background:var(--loss);box-shadow:0 0 6px var(--loss);}
  .ticket-status.none{background:#445c4e;}
  .ticket-pct{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;}
  .ticket-meta{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);margin-top:8px;display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px;}
  .ticket-units{font-weight:600;}
  .ticket-units.win{color:var(--win);}
  .ticket-units.loss{color:var(--loss);}

  .cmp-table{width:100%;border-collapse:collapse;font-size:14px;}
  .cmp-table th{text-align:left;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);font-weight:500;padding:0 10px 10px;border-bottom:1px solid var(--line);}
  .cmp-table th.num, .cmp-table td.num{text-align:right;font-family:var(--mono);}
  .cmp-table td{padding:10px;border-bottom:1px solid var(--line);}
  .cmp-table tr:last-child td{border-bottom:none;}
  .cmp-table td.name{display:flex;align-items:center;gap:8px;}
  .row-alt td{background:rgba(244,247,242,0.015);}

  .chart-card{background:var(--pitch-800);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .chart-wrap{position:relative;height:220px;}

  .bars{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:12px;font-size:13px;}
  .bar-label{color:var(--chalk-dim);font-family:var(--mono);font-size:12px;}
  .bar-track{height:8px;background:var(--pitch-700);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .bar-fill.win{background:var(--win);}
  .bar-fill.loss{background:var(--loss);}
  .bar-num{font-family:var(--mono);font-size:12px;text-align:right;color:var(--chalk-dim);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  @media (max-width:700px){.grid2{grid-template-columns:1fr;gap:28px;}}

  .picks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .pick{display:grid;grid-template-columns:70px 1fr auto auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;}
  .pick:last-child{border-bottom:none;}
  .pick:nth-child(even){background:rgba(244,247,242,0.015);}
  .pick-date{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);}
  .pick-teams{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pick-tier{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--amber-dim);color:var(--amber);white-space:nowrap;}
  .pick-result{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .pick-result.win{background:var(--win-bg);color:var(--win);}
  .pick-result.loss{background:var(--loss-bg);color:var(--loss);}
  .pick-result.pending{background:var(--pitch-700);color:var(--chalk-dim);}

  footer.note{text-align:center;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);padding-top:24px;line-height:1.7;}
  .loading, .error{text-align:center;padding:60px 20px;color:var(--chalk-dim);font-family:var(--mono);font-size:13px;}
  .error{color:var(--loss);}
  ::selection{background:var(--amber);color:var(--pitch-950);}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

<header class="top">
  <img class="logo-img" src="./logo-header.png" alt="ReyBetIA" />
  <p class="brand">REY<span>BET</span>IA</p>
  <p class="tagline">El Rey de Ambos Marcan</p>
  <p class="updated" id="updatedTxt"><span class="dot"></span>Cargando…</p>
</header>

<div class="hero-pick" id="heroPick"></div>

<nav class="tabs" id="tabs"></nav>

<div class="wrap" id="app">
  <div class="loading">Cargando pronósticos…</div>
</div>

<script>

const TABS = [
  {id:"btts",  label:"Ambos Marcan"},
  {id:"o15",   label:"Over 1.5"},
  {id:"o25",   label:"Over 2.5"},
  {id:"combo", label:"BTTS+O2.5"},
  {id:"ht05",  label:"1er Tiempo O0.5"},
  {id:"score", label:"Marcador Exacto"},
  {id:"stats", label:"Estadísticas"},
];

let DATA = null;
let HOY_STR = "";

function notaLigaConfianza(p){
  // Nota dinamica de confianza por liga (calculada en vivo por backtest.py
  // segun el ROI real acumulado de BTTS en esa liga - no es una lista
  // fija, se recalcula sola en cada corrida). Se muestra en TODOS los
  // mercados, no solo BTTS, porque el riesgo de la liga en si aplica
  // igual sin importar el mercado que se este mirando.
  if(p.liga_confianza === "alta"){
    return ' · <span title="Esta liga viene con ROI positivo real en BTTS (minimo 15 casos)" style="color:var(--win);">🟢 liga de confianza alta</span>';
  }
  if(p.liga_confianza === "baja"){
    return ' · <span title="Esta liga viene con perdidas fuertes reales en BTTS (minimo 15 casos)" style="color:var(--loss);">🔴 liga de riesgo alto</span>';
  }
  return "";
}

function notaRescateBtts(p){
  // Muestra que camino especifico produjo el JUGAR de BTTS - especialmente
  // util para distinguir un rescate (partido que el modelo normal
  // marcaba Evitar, pero otra regla lo convirtio a JUGAR) de un camino
  // normal (VIP+/VIP/Fuerte/Stake10 directo).
  const motivo = p.motivo_btts;
  if(!motivo || p.nivel_final !== "JUGAR") return "";
  const esRescate = motivo.startsWith("rescate_");
  const etiquetas = {
    "camino_normal_VIP+": "camino normal (VIP+)",
    "camino_normal_Stake10": "camino normal (Stake10)",
    "camino_normal_VIP_Fuerte_edge_ok": "camino normal (VIP/Fuerte)",
    "rescate_evitar_edge_bajo_prob_baja": "🔄 rescate: edge + prob baja",
    "rescate_evitar_lambda_moderado": "🔄 rescate: lambda moderado",
    "rescate_oro_btts": "🔄 rescate: oro BTTS",
    "rescate_plata": "🔄 rescate: plata",
    "rescate_xg_alto_btts_historico_alto": "🔄 rescate: xG e histórico altos",
    "rescate_cuota_favorable_1X2": "🔄 rescate: cuota 1X2 favorable",
  };
  const texto = etiquetas[motivo] || motivo;
  const color = esRescate ? "var(--amber)" : "var(--chalk-dim)";
  return ` · <span title="Por que se activo esta señal de BTTS" style="color:${color};">${texto}</span>`;
}

function notaOver15Ht(p){
  // Nota informativa (no es una señal propia, no tiene JUGAR/EVITAR ni
  // cuota asociada) - destaca los partidos donde ademas de superar el
  // umbral de 0.5 goles en el primer tiempo, la probabilidad de que sean
  // 2+ goles en el primer tiempo tambien es alta.
  const prob15 = p.prob_over15_ht;
  if(prob15 == null || prob15 < 0.5) return "";
  return ` · <span title="Probabilidad de 2+ goles en el primer tiempo (informativo, no es señal propia)" style="color:var(--amber);">🔥 +${(prob15*100).toFixed(0)}% de 2+ goles en el 1T</span>`;
}

function edgeTxt(prob, cuota){
  // Edge = probabilidad que decimos - probabilidad que ya implica la cuota
  // del mercado. Solo se muestra cuando es positivo (creemos tener ventaja
  // real sobre lo que ya cobra la cuota) - un edge negativo no se destaca.
  if(prob == null || !cuota) return "";
  const edge = prob - (1 / cuota);
  if(edge <= 0) return "";
  return ` · <span style="color:var(--amber);">edge +${(edge*100).toFixed(1)}%</span>`;
}

function diaBadge(p){
  const fechaSolo = (p.fecha_partido || p.fecha || "").split(" ")[0];
  if(!fechaSolo) return "";
  if(fechaSolo === HOY_STR) return '<span style="color:var(--win);">HOY</span>';
  return '<span style="color:var(--amber);">MAÑANA</span>';
}

function respaldoBadge(p){
  let extra = "";
  if(p.es_equipo_filial){
    extra += ' · <span title="Uno de los dos equipos es filial/reserva/desarrollo (plantel rotativo) - dato informativo, no cambia la señal." style="color:var(--chalk-dim);">🏷️ filial</span>';
  }
  if(p.usa_temporada_anterior){
    return extra + ' · <span title="Uno de los equipos no tiene suficiente muestra ni de su lado ni en general esta temporada, se usaron datos de la temporada anterior" style="color:var(--chalk-dim);">🔄 temp. anterior</span>';
  }
  if(p.usa_promedio_general){
    return extra + ' · <span title="Uno de los equipos todavia no tiene suficientes partidos como local/visitante, se uso el promedio general de la temporada" style="color:var(--chalk-dim);">📊 promedio general</span>';
  }
  return extra;
}

function confirmacionCuotaBadge(p, mercado){
  // mercado: "btts" | "o15" | "o25". movimiento_X_pp ya viene calculado
  // desde el servidor (backtest.py) y solo tiene valor si esa señal
  // especifica es JUGAR - si es null, no aplica (no es JUGAR, o falta dato).
  const mov = p["movimiento_" + mercado + "_pp"];
  const umbral = (DATA && DATA.umbral_movimiento_pp) || 4;
  if(mov == null || mov < umbral) return "";
  return ` · <span title="La probabilidad implicita de este mercado subio ${mov.toFixed(1)} puntos porcentuales desde que se detecto la señal (cuota bajando = el mercado confirma mas probabilidad)." style="color:var(--win);">📉 probabilidad subiendo (+${mov.toFixed(1)}pp)</span>`;
}

function pctTxt(s, conN){
  if(!s) return "—";
  const n = s.bets ?? s.total ?? 0;
  if(n === 0) return "—";
  const wins = s.wins ?? s.ganados ?? 0;
  const pct = s.acierto_pct.toFixed(0) + "%";
  return conN ? `${pct} (${wins}/${n})` : pct;
}
function nOf(s){ return s ? (s.bets ?? s.total ?? 0) : 0; }
function statusClass(s){
  if(!s || nOf(s) === 0) return "none";
  return (s.profit_u ?? 0) >= 0 ? "win" : "loss";
}

function badgesExtra(p){
  const badges = [];
  if(p.vip_elite) badges.push(`<span class="pick-tier">⭐ ${p.vip_elite}</span>`);
  if(p.nivel_confianza){
    const emoji = {"ÉLITE":"🥇","PLATA":"🥈","BRONCE":"🥉"}[p.nivel_confianza] || "🏅";
    badges.push(`<span class="pick-tier">${emoji} ${p.nivel_confianza}</span>`);
  }
  if(p.oro) badges.push(`<span class="pick-tier">🟡 ${p.oro}</span>`);
  return badges.length ? `<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;">${badges.join("")}</div>` : "";
}

function renderMercado(picks, probKey, senalKey, tierKey, cuotaKey, resultadoDeseado, resultKey, mercadoKey){
  // Lee la probabilidad, RECALIBRANDO al vuelo los partidos viejos: los
  // registrados antes de que existiera prob_btts_calibrada tienen ese
  // campo vacio para siempre (el sistema no recalcula partidos ya
  // guardados). ANTES este respaldo aplicaba una formula lineal fija
  // (0.329 + 0.355*cruda), pero esa formula quedo OBSOLETA cuando el
  // modelo de signals.py cambio (primero a tabla por categoria, despues
  // al modelo continuo Stake10+cs_max) - aplicarla ahora daria un numero
  // INVENTADO, no una recalibracion real. Es mas honesto mostrar la
  // probabilidad cruda tal cual para esos partidos viejos, que inventar
  // una recalibracion con una formula que ya no corresponde al modelo
  // actual.
  const P = (p) => {
    const v = p[probKey];
    if(v != null) return v;
    if(probKey === "prob_btts_calibrada" && p.prob_btts != null){
      return p.prob_btts;
    }
    return null;
  };

  // "Mayor confianza" = decision JUGAR Y el nivel es un nivel real de confianza
  // (VIP+/VIP/Fuerte) - NO incluye señales "Evitar" rescatadas a JUGAR por una
  // regla especial, porque esas no son de alta confianza aunque tecnicamente jueguen.
  const conSenal = picks.filter(p => p[senalKey] === "JUGAR" && p[tierKey] && p[tierKey] !== "Evitar");
  const confianzaHtml = conSenal.length === 0
    ? '<div class="empty">Sin señales de mayor confianza hoy todavía.</div>'
    : conSenal.map(p => {
        const resultado = resultKey ? p[resultKey] : null;
        const resultadoHtml = resultado === true
          ? `<div class="conf-prob" style="color:var(--win);font-size:15px;">✓ Ganada</div>`
          : resultado === false
          ? `<div class="conf-prob" style="color:var(--loss);font-size:15px;">✕ Perdida</div>`
          : `<div class="conf-prob">${P(p) != null ? (P(p)*100).toFixed(0)+"%" : "—"}</div>`;
        return `
        <div class="conf-card">
          <div>
            <div class="conf-teams">${p.local} vs ${p.visitante}</div>
            <div class="conf-liga">${p.liga || ""} · ${diaBadge(p)}${respaldoBadge(p)}${confirmacionCuotaBadge(p, mercadoKey)}${notaLigaConfianza(p)}${mercadoKey === 'ht05' ? notaOver15Ht(p) : ''}${mercadoKey === 'btts' ? notaRescateBtts(p) : ''}</div>
            ${badgesExtra(p)}
          </div>
          <div class="conf-tier">
            <div class="conf-tier-val">${p[tierKey] || "JUGAR"}</div>
            <div class="conf-cuota">cuota ${p[cuotaKey] ? p[cuotaKey].toFixed(2) : "—"}${edgeTxt(P(p), p[cuotaKey])}</div>
          </div>
          ${resultadoHtml}
        </div>`;
      }).join("");

  // Top probabilidad: independiente de si el modelo disparo formalmente "JUGAR"
  // (que es un criterio estricto de VIP+/VIP/Fuerte) - esto muestra los
  // partidos con la probabilidad mas alta de este mercado, punto, para que
  // siempre haya algo que ver aunque hoy no haya ninguna señal formal.
  const idsConSenal = new Set(conSenal.map(p => p.local + "|" + p.visitante + "|" + p.fecha));
  const topProb = picks
    .filter(p => P(p) != null && !idsConSenal.has(p.local + "|" + p.visitante + "|" + p.fecha))
    .sort((a, b) => P(b) - P(a))
    .slice(0, 5);
  const topProbHtml = topProb.length === 0
    ? '<div class="empty">Sin datos suficientes todavía.</div>'
    : topProb.map(p => {
        const resultado = resultKey ? p[resultKey] : null;
        const resultadoHtml = resultado === true
          ? `<div class="conf-prob" style="color:var(--win);font-size:15px;">✓ Ganada</div>`
          : resultado === false
          ? `<div class="conf-prob" style="color:var(--loss);font-size:15px;">✕ Perdida</div>`
          : `<div class="conf-prob">${(P(p)*100).toFixed(0)}%</div>`;
        return `
        <div class="conf-card">
          <div>
            <div class="conf-teams">${p.local} vs ${p.visitante}</div>
            <div class="conf-liga">${p.liga || ""} · ${diaBadge(p)}${respaldoBadge(p)}${confirmacionCuotaBadge(p, mercadoKey)}${notaLigaConfianza(p)}${mercadoKey === 'ht05' ? notaOver15Ht(p) : ''}${mercadoKey === 'btts' ? notaRescateBtts(p) : ''}</div>
            ${badgesExtra(p)}
          </div>
          <div class="conf-tier">
            <div class="conf-tier-val" style="color:var(--chalk-dim);font-size:12px;">${p[tierKey] || "sin señal formal"}</div>
            <div class="conf-cuota">cuota ${p[cuotaKey] ? p[cuotaKey].toFixed(2) : "—"}${edgeTxt(P(p), p[cuotaKey])}</div>
          </div>
          ${resultadoHtml}
        </div>`;
      }).join("");

  // Ordenados de MAYOR a MENOR probabilidad. Los que no tienen
  // probabilidad calculada (s/d) van al final, no revueltos en el medio.
  const picksOrdenados = [...picks].sort((a, b) => {
    const pa = P(a), pb = P(b);
    if(pa == null && pb == null) return 0;
    if(pa == null) return 1;
    if(pb == null) return -1;
    return pb - pa;
  });

  const todosHtml = picksOrdenados.length === 0
    ? '<div class="empty">Todavía no hay partidos analizados hoy.</div>'
    : '<div class="match-list">' + picksOrdenados.map(p => {
        const prob = P(p);
        const cuotaTxt = p[cuotaKey] ? p[cuotaKey].toFixed(2) : "—";
        const pctT = prob != null ? `${(prob*100).toFixed(0)}%` : "s/d";
        const resultado = resultKey ? p[resultKey] : null;
        let badgeClass, badgeTxt;
        if(resultado === true){ badgeClass = "ganada"; badgeTxt = "✓ Ganada"; }
        else if(resultado === false){ badgeClass = "perdida"; badgeTxt = "✕ Perdida"; }
        else {
          const siNo = prob == null ? null : (prob >= 0.5 ? "si" : "no");
          badgeClass = siNo || "";
          badgeTxt = siNo === "si" ? "Sí" : siNo === "no" ? "No" : "Sin datos";
        }
        const tierTxt = (p[tierKey] && p[tierKey] !== "Evitar") ? `<span style="color:var(--amber);">${p[tierKey]}</span> · ` : "";
        return `
          <div class="match-row">
            <div>
              <div class="match-teams">${p.local} vs ${p.visitante}</div>
              <div class="match-liga">${tierTxt}${p.liga || ""} · ${diaBadge(p)}${respaldoBadge(p)}${confirmacionCuotaBadge(p, mercadoKey)}${notaLigaConfianza(p)}${mercadoKey === 'ht05' ? notaOver15Ht(p) : ''}${mercadoKey === 'btts' ? notaRescateBtts(p) : ''}</div>
              ${badgesExtra(p)}
            </div>
            <span class="match-pct">cuota ${cuotaTxt} · ${pctT}${edgeTxt(prob, p[cuotaKey])}</span>
            <span class="match-badge ${badgeClass}">${badgeTxt}</span>
          </div>`;
      }).join("") + '</div>';

  return `
    <section>
      <p class="section-title">⭐ Mayor confianza</p>
      ${confianzaHtml}
    </section>
    <section>
      <p class="section-title">🔝 Mayor probabilidad</p>
      ${topProbHtml}
    </section>
    <section>
      <p class="section-title">Todos los partidos analizados — ${resultadoDeseado}</p>
      ${todosHtml}
    </section>`;
}

function renderCombo(picks){
  const elegibles = picks.filter(p => p.senal_btts_o25 && p.senal_btts_o25 !== "—");
  if(elegibles.length === 0){
    return '<div class="empty">Hoy ningún partido cumple el criterio para la combinada BTTS + Over 2.5.</div>';
  }
  return '<div class="match-list">' + elegibles.map(p => {
    const cuotaCombo = (p.cuota_btts && p.cuota_o25) ? (p.cuota_btts * p.cuota_o25).toFixed(2) : "—";
    const resultado = p.resultado_combo;
    let badgeClass, badgeTxt;
    if(resultado === true){ badgeClass = "ganada"; badgeTxt = "✓ Ganada"; }
    else if(resultado === false){ badgeClass = "perdida"; badgeTxt = "✕ Perdida"; }
    else { badgeClass = p.senal_btts_o25 === 'VIP' ? 'si' : 'no'; badgeTxt = p.senal_btts_o25; }
    return `
      <div class="match-row">
        <div>
          <div class="match-teams">${p.local} vs ${p.visitante}</div>
          <div class="match-liga">${p.liga || ""} · ${diaBadge(p)}${respaldoBadge(p)}${notaLigaConfianza(p)}</div>
        </div>
        <span class="match-pct">cuota ${cuotaCombo} · ${p.senal_btts_o25}</span>
        <span class="match-badge ${badgeClass}">${badgeTxt}</span>
      </div>`;
  }).join("") + '</div>';
}

function renderMarcadorExacto(picks, stats){
  const conPred = picks.filter(p => p.marcador_exacto_sugerido);
  const heroHtml = stats && stats.total > 0 ? `
    <div class="market-hero">
      <p class="big">${stats.acierto_pct.toFixed(0)}%</p>
      <p class="sub">acierto histórico en ${stats.total} partidos · sin cuota disponible, solo %acierto</p>
    </div>` : `
    <div class="market-hero">
      <p class="sub">Todavía no hay suficiente historial para medir el %acierto.</p>
    </div>`;

  const listaHtml = conPred.length === 0
    ? '<div class="empty">Sin pronósticos de marcador para hoy.</div>'
    : '<div class="match-list">' + conPred.map(p => {
        const real = p.marcador_exacto_real;
        const acerto = real ? (real === p.marcador_exacto_sugerido) : null;
        const badgeHtml = real
          ? `<span class="match-badge ${acerto ? 'ganada' : 'perdida'}">${p.marcador_exacto_sugerido} ${acerto ? '✓' : `(real ${real})`}</span>`
          : `<span class="match-badge score">${p.marcador_exacto_sugerido}</span>`;
        return `
        <div class="match-row" style="grid-template-columns:1fr auto;">
          <div>
            <div class="match-teams">${p.local} vs ${p.visitante}</div>
            <div class="match-liga">${p.liga || ""} · ${diaBadge(p)}${respaldoBadge(p)}</div>
          </div>
          ${badgeHtml}
        </div>`;
      }).join("") + '</div>';

  return heroHtml + `<section><p class="section-title">Pronósticos de hoy</p>${listaHtml}</section>`;
}

const MERCADO_ORDEN = ["BTTS", "Over 1.5", "Over 2.5", "BTTS + Over 2.5 (VIP)", "Over 0.5 1er tiempo"];
const CATEGORIA_ORDEN = ["Stake10","VIP+","VIP","Fuerte","ORO_FUERTE","ORO_BTTS","ÉLITE","PLATA","BRONCE","VIP ELITE"];

function renderTickets(comparativo){
  const hist = comparativo.historico.mercados;
  return MERCADO_ORDEN.map(nombre => {
    const s = hist[nombre];
    const cls = statusClass(s);
    const n = nOf(s);
    const units = n ? `${s.profit_u >= 0 ? "+" : ""}${s.profit_u.toFixed(1)}u` : "—";
    return `
      <div class="ticket">
        <div class="ticket-name"><span>${nombre}</span><span class="ticket-status ${cls}"></span></div>
        <div class="ticket-pct">${pctTxt(s)}</div>
        <div class="ticket-meta"><span>${n} caso${n===1?"":"s"}</span><span class="ticket-units ${cls}">${units}</span></div>
      </div>`;
  }).join("");
}

function renderCmpTable(comparativo){
  const {hoy, recientes, historico} = comparativo;
  const filas = MERCADO_ORDEN.map((nombre, i) => {
    const sh = hoy.mercados[nombre], sr = recientes.mercados[nombre], st = historico.mercados[nombre];
    return `
      <tr class="${i%2? 'row-alt':''}">
        <td class="name"><span class="ticket-status ${statusClass(st)}"></span>${nombre}</td>
        <td class="num">${pctTxt(sh)}</td>
        <td class="num">${pctTxt(sr)}</td>
        <td class="num"><b>${pctTxt(st, true)}</b></td>
      </tr>`;
  }).join("");
  return `<table class="cmp-table"><thead><tr><th>Mercado</th><th class="num">Hoy</th><th class="num">7 días</th><th class="num">Histórico</th></tr></thead><tbody>${filas}</tbody></table>`;
}

function renderBars(dictHist, orden){
  const nombres = orden.filter(n => dictHist[n] && (dictHist[n].total_detectado ?? nOf(dictHist[n])) > 0);
  if(nombres.length === 0) return '<div class="empty">Sin datos todavía en esta sección.</div>';
  return '<div class="bars">' + nombres.map(nombre => {
    const st = dictHist[nombre];
    const totalDetectado = st.total_detectado ?? nOf(st);
    const pendientes = totalDetectado - nOf(st);
    const notaPend = pendientes > 0 ? ` <span style="color:var(--chalk-dim);">(+${pendientes} pend.)</span>` : "";
    if(nOf(st) === 0){
      return `<div class="bar-row"><span class="bar-label">${nombre}</span><div class="bar-track"></div><span class="bar-num">sin resultado${notaPend}</span></div>`;
    }
    const pct = st.acierto_pct ?? 0;
    const cls = statusClass(st);
    return `<div class="bar-row"><span class="bar-label">${nombre}</span><div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div><span class="bar-num">${pctTxt(st, true)}${notaPend}</span></div>`;
  }).join("") + '</div>';
}

function renderPicksResueltos(picks){
  if(!picks || picks.length === 0) return '<div class="empty">Todavía no hay picks resueltos.</div>';
  return '<div class="picks">' + picks.slice(0, 25).map(p => {
    let resClass = "pending", resTxt = "?";
    if(p.resultado_btts === true){ resClass = "win"; resTxt = "✓"; }
    else if(p.resultado_btts === false){ resClass = "loss"; resTxt = "✕"; }
    const fecha = (p.fecha_partido || p.fecha || "").split(" ")[0].slice(5);
    return `<div class="pick"><span class="pick-date">${fecha}</span><span class="pick-teams">${p.local} vs ${p.visitante}</span><span class="pick-tier">${p.senal_btts_optimizada || "—"}</span><span class="pick-result ${resClass}">${resTxt}</span></div>`;
  }).join("") + '</div>';
}

function renderHistorialMercado(picksRecientes, señalKey, tierKey, resultadoKey, cuotaKey, esCombo){
  // Historial dia a dia de un mercado especifico: solo señales JUGAR (o
  // elegibles para la combinada), mas recientes primero, con su resultado
  // cuando ya se conozca. Esto es lo que se mantiene visible aunque el
  // partido ya haya salido de la ventana "hoy/mañana".
  const filtrados = esCombo
    ? picksRecientes.filter(p => p.senal_btts_o25 && p.senal_btts_o25 !== "—")
    : picksRecientes.filter(p => p[señalKey] === "JUGAR");

  if(filtrados.length === 0){
    return '<div class="empty">Todavía no hay historial en este mercado.</div>';
  }

  return '<div class="picks">' + filtrados.slice(0, 30).map(p => {
    const resultado = esCombo ? p.resultado_combo : p[resultadoKey];
    let resClass = "pending", resTxt = "?";
    if(resultado === true){ resClass = "win"; resTxt = "✓"; }
    else if(resultado === false){ resClass = "loss"; resTxt = "✕"; }
    const fecha = (p.fecha_partido || p.fecha || "").split(" ")[0].slice(5);
    const etiqueta = esCombo ? p.senal_btts_o25 : (p[tierKey] || "—");
    const cuotaTxt = esCombo
      ? (p.cuota_combo != null ? p.cuota_combo.toFixed(2) : "—")
      : (p[cuotaKey] != null ? p[cuotaKey].toFixed(2) : "—");
    return `<div class="pick"><span class="pick-date">${fecha}</span><span class="pick-teams">${p.local} vs ${p.visitante}</span><span class="pick-tier" title="cuota ${cuotaTxt}">${etiqueta}</span><span class="pick-result ${resClass}">${resTxt}</span></div>`;
  }).join("") + '</div>';
}

function renderChart(serie){
  if(!serie || serie.length < 2) return;
  const ctx = document.getElementById("trendChart");
  if(!ctx) return;
  new Chart(ctx, {
    type: "line",
    data: {
      labels: serie.map(d => d.fecha.slice(5)),
      datasets: [{
        label: "% acierto BTTS por día", data: serie.map(d => d.acierto_pct),
        borderColor: "#e8a33d", backgroundColor: "rgba(232,163,61,0.12)",
        borderWidth: 2, tension: 0.3, fill: true, pointRadius: 3, pointBackgroundColor: "#e8a33d",
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display:false } },
      scales: {
        y: { min:0, max:100, ticks:{ color:"#b9c9bd", callback:v=>v+"%" }, grid:{ color:"#2b4a38" } },
        x: { ticks:{ color:"#b9c9bd" }, grid:{ display:false } },
      }
    }
  });
}

function renderCalibracion(calibracion){
  const mercados = Object.keys(calibracion || {}).filter(m => calibracion[m] && calibracion[m].length > 0);
  if(mercados.length === 0) return '<div class="empty">Todavía no hay suficientes datos para medir la calibración (necesita partidos ya jugados con probabilidad calculada).</div>';

  return mercados.map(mercado => {
    const filas = calibracion[mercado].map(b => {
      const diff = b.diferencia;
      const emoji = Math.abs(diff) <= 5 ? "✅" : (diff < -5 ? "⚠️" : "💪");
      const diffTxt = (diff >= 0 ? "+" : "") + diff.toFixed(0) + "pp";
      return `
        <tr>
          <td class="name">${emoji} ${b.rango}</td>
          <td class="num">${b.total}</td>
          <td class="num">${b.acierto_pct.toFixed(0)}%</td>
          <td class="num">${diffTxt}</td>
        </tr>`;
    }).join("");
    return `
      <p class="bar-label" style="margin:16px 0 8px;">${mercado}</p>
      <table class="cmp-table">
        <thead><tr><th>Dijimos</th><th class="num">n</th><th class="num">Acertó</th><th class="num">Diferencia</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>`;
  }).join("");
}

function renderMovimientoValidacion(mv){
  const con = mv?.con_movimiento, sin = mv?.sin_movimiento;
  if((!con || con.total === 0) && (!sin || sin.total === 0)){
    return '<div class="empty">Todavía no hay partidos jugados con suficiente historial de movimiento de cuota.</div>';
  }
  const fila = (etiqueta, s) => {
    if(!s || s.total === 0) return `<tr><td class="name">${etiqueta}</td><td class="num" colspan="2">Sin casos todavía</td></tr>`;
    return `<tr><td class="name">${etiqueta}</td><td class="num">${s.total}</td><td class="num">${s.acierto_pct.toFixed(0)}% (${s.aciertos}/${s.total})</td></tr>`;
  };
  return `<table class="cmp-table"><thead><tr><th>Grupo</th><th class="num">n</th><th class="num">Acierto</th></tr></thead><tbody>
    ${fila("Con +4pp de movimiento", con)}
    ${fila("Sin ese movimiento", sin)}
  </tbody></table>`;
}

function renderMovimientoLista(picksRecientes, umbral){
  // Lista, partido por partido, de todas las señales JUGAR (en cualquiera
  // de los 3 mercados) que tuvieron +4pp de movimiento - para que quede
  // un registro navegable de CUALES fueron, no solo el numero agregado.
  const combos = [
    ["btts", "movimiento_btts_pp", "nivel_final", "senal_btts_optimizada", "resultado_btts", "Ambos Marcan"],
    ["o15", "movimiento_o15_pp", "sug_o15", "senal_o15_tier", "resultado_o15", "Over 1.5"],
    ["o25", "movimiento_o25_pp", "sug_o25", "senal_o25", "resultado_o25", "Over 2.5"],
  ];
  const encontrados = [];
  picksRecientes.forEach(p => {
    combos.forEach(([key, movKey, señalKey, tierKey, resKey, nombreMercado]) => {
      const mov = p[movKey];
      if(mov != null && mov >= umbral && p[señalKey] === "JUGAR"){
        encontrados.push({p, mov, tier: p[tierKey], resultado: p[resKey], mercado: nombreMercado});
      }
    });
  });
  if(encontrados.length === 0){
    return '<div class="empty">Todavía no hay partidos individuales con +4pp de movimiento en el historial reciente.</div>';
  }
  encontrados.sort((a,b) => (b.p.fecha_partido || "").localeCompare(a.p.fecha_partido || ""));
  return '<div class="picks">' + encontrados.map(e => {
    let resClass = "pending", resTxt = "?";
    if(e.resultado === true){ resClass = "win"; resTxt = "✓"; }
    else if(e.resultado === false){ resClass = "loss"; resTxt = "✕"; }
    const fecha = (e.p.fecha_partido || e.p.fecha || "").split(" ")[0].slice(5);
    return `<div class="pick"><span class="pick-date">${fecha}</span><span class="pick-teams">${e.p.local} vs ${e.p.visitante} <span style="color:var(--chalk-dim);">(${e.mercado})</span></span><span class="pick-tier">+${e.mov.toFixed(1)}pp</span><span class="pick-result ${resClass}">${resTxt}</span></div>`;
  }).join("") + '</div>';
}

function renderPorLiga(porLiga){
  if(!porLiga || porLiga.length === 0){
    return '<div class="empty">Todavía no hay suficiente muestra por liga (mínimo 3 partidos jugados por liga).</div>';
  }
  const filas = porLiga.map((l, i) => {
    const cls = l.profit_u >= 0 ? "win" : "loss";
    return `
      <tr class="${i%2? 'row-alt':''}">
        <td class="name"><span class="ticket-status ${cls}"></span>${l.liga}</td>
        <td class="num">${l.total}</td>
        <td class="num">${l.acierto_pct.toFixed(0)}% (${l.ganados}/${l.total})</td>
        <td class="num">${l.profit_u >= 0 ? "+" : ""}${l.profit_u.toFixed(1)}u</td>
      </tr>`;
  }).join("");
  return `<table class="cmp-table"><thead><tr><th>Liga</th><th class="num">n</th><th class="num">Acierto BTTS</th><th class="num">Unidades</th></tr></thead><tbody>${filas}</tbody></table>`;
}

    </section>
    <section><p class="section-title">Historial de picks (resueltos)</p>${renderPicksResueltos(data.picks_recientes)}</section>
    <footer class="note">🟢 gana unidades · 🔴 pierde unidades<br/>Con pocos partidos, un solo resultado mueve el % mucho — cautela por debajo de ~15-20 casos.</footer>
  `;
}

function switchTab(id){
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + id));
  if(id === "stats" && DATA) renderChart(DATA.serie_diaria);
}

function elegirMejorCandidato(picks){
  // Usa la probabilidad CALIBRADA de BTTS (con respaldo a la cruda solo
  // para partidos muy viejos que no la tengan) - antes esta funcion usaba
  // prob_btts sin calibrar directamente, por eso la tarjeta destacada
  // mostraba un numero distinto (mas alto) que el resto de la pagina.
  const probBtts = (p) => p.prob_btts_calibrada != null ? p.prob_btts_calibrada : p.prob_btts;
  const candidatos = [];
  picks.forEach(p => {
    if(p.vip_elite) candidatos.push({p, score: 1000 + (probBtts(p)||0), tier: p.vip_elite, mkt: "Ambos Marcan"});
    else if(p.senal_btts_optimizada === "VIP+" && p.nivel_final === "JUGAR") candidatos.push({p, score: 900 + (probBtts(p)||0), tier: "VIP+", mkt: "Ambos Marcan"});
    else if(p.senal_o15_tier === "VIP" && p.sug_o15 === "JUGAR") candidatos.push({p, score: 800 + (p.prob_o15||0), tier: "VIP", mkt: "Over 1.5"});
    else if(p.senal_o25 === "VIP" && p.sug_o25 === "JUGAR") candidatos.push({p, score: 800 + (p.prob_o25||0), tier: "VIP", mkt: "Over 2.5"});
    else if(p.senal_btts_optimizada === "VIP" && p.nivel_final === "JUGAR") candidatos.push({p, score: 700 + (probBtts(p)||0), tier: "VIP", mkt: "Ambos Marcan"});
  });
  if(candidatos.length === 0) return null;
  candidatos.sort((a,b) => b.score - a.score);
  return candidatos[0];
}

function renderTarjetaPick(top, etiquetaDia){
  const probBtts = (p) => p.prob_btts_calibrada != null ? p.prob_btts_calibrada : p.prob_btts;
  const prob = top.mkt === "Over 1.5" ? top.p.prob_o15 : top.mkt === "Over 2.5" ? top.p.prob_o25 : probBtts(top.p);
  const resultado = top.mkt === "Over 1.5" ? top.p.resultado_o15 : top.mkt === "Over 2.5" ? top.p.resultado_o25 : top.p.resultado_btts;
  const rightHtml = resultado === true
    ? `<div class="hero-pick-pct" style="color:var(--win);">✓ Ganada</div>`
    : resultado === false
    ? `<div class="hero-pick-pct" style="color:var(--loss);">✕ Perdida</div>`
    : `<div class="hero-pick-pct">${prob != null ? (prob*100).toFixed(0)+"%" : "—"}</div>`;

  return `
    <div class="hero-pick-card">
      <div>
        <span class="hero-pick-badge">${etiquetaDia} · ${top.tier}</span>
        <div class="hero-pick-teams">${top.p.local} vs ${top.p.visitante}</div>
        <div class="hero-pick-liga">${top.p.liga || ""}</div>
      </div>
      <div class="hero-pick-right">
        ${rightHtml}
        <div class="hero-pick-mkt">${top.mkt}</div>
      </div>
    </div>`;
}

function renderHeroPick(picks){
  const el = document.getElementById("heroPick");
  if(!el) return;

  const deHoy = picks.filter(p => (p.fecha_partido || p.fecha || "").split(" ")[0] === HOY_STR);
  const deManana = picks.filter(p => (p.fecha_partido || p.fecha || "").split(" ")[0] !== HOY_STR);

  const topHoy = elegirMejorCandidato(deHoy);
  const topManana = elegirMejorCandidato(deManana);

  let html = "";
  if(topHoy) html += renderTarjetaPick(topHoy, "🔥 Pick de hoy");
  if(topManana) html += renderTarjetaPick(topManana, "📅 Pick de mañana");

  el.innerHTML = html;
}

function render(data){
  DATA = data;
  HOY_STR = data.hoy_referencia || "";
  const totalHist = data.comparativo.historico.total_partidos_evaluados;
  const picks = data.picks_hoy || [];

  document.getElementById("updatedTxt").innerHTML =
    `<span class="dot"></span>Actualizado ${new Date(data.actualizado).toLocaleString("es-CO", {dateStyle:"medium", timeStyle:"short"})} · ${totalHist} partidos evaluados en total`;

  renderHeroPick(picks);

  // Mantener la pestaña que el usuario ya tenia abierta (importante ahora
  // que la pagina se refresca sola cada 5 min - sin esto, cada refresco
  // te sacaba de vuelta a la primera pestaña).
  const tabActivaAntes = document.querySelector(".tab-btn.active")?.dataset.tab || TABS[0].id;

  document.getElementById("tabs").innerHTML = TABS.map((t) =>
    `<button class="tab-btn ${t.id===tabActivaAntes?'active':''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join("");

  const historialBtts = `<section><p class="section-title">📅 Historial de picks — Ambos Marcan</p>${renderHistorialMercado(data.picks_recientes, "nivel_final", "senal_btts_optimizada", "resultado_btts", "cuota_btts", false)}</section>`;
  const historialO15 = `<section><p class="section-title">📅 Historial de picks — Over 1.5</p>${renderHistorialMercado(data.picks_recientes, "sug_o15", "senal_o15_tier", "resultado_o15", "cuota_o15", false)}</section>`;
  const historialO25 = `<section><p class="section-title">📅 Historial de picks — Over 2.5</p>${renderHistorialMercado(data.picks_recientes, "sug_o25", "senal_o25", "resultado_o25", "cuota_o25", false)}</section>`;
  const historialCombo = `<section><p class="section-title">📅 Historial de picks — BTTS+O2.5</p>${renderHistorialMercado(data.picks_recientes, null, null, null, null, true)}</section>`;
  const historialHt05 = `<section><p class="section-title">📅 Historial de picks — 1er Tiempo O0.5</p>${renderHistorialMercado(data.picks_recientes, "sug_ht05", "senal_ht05_tier", "resultado_ht05", "cuota_ht_over05", false)}</section>`;

  const notaHt05 = `<div class="empty" style="margin-bottom:16px;">⚠️ Mercado nuevo (agosto 2026) — todavía no hay suficiente historial para confirmar en qué franja de cuota da ganancia real. Revisa esto con cuidado hasta que se acumule más muestra.</div>`;

  const panels = {
    btts: renderMercado(picks, "prob_btts_calibrada", "nivel_final", "senal_btts_optimizada", "cuota_btts", "¿Ambos equipos marcan?", "resultado_btts", "btts") + historialBtts,
    o15: renderMercado(picks, "prob_o15", "sug_o15", "senal_o15_tier", "cuota_o15", "¿Más de 1.5 goles?", "resultado_o15", "o15") + historialO15,
    o25: renderMercado(picks, "prob_o25", "sug_o25", "senal_o25", "cuota_o25", "¿Más de 2.5 goles?", "resultado_o25", "o25") + historialO25,
    combo: `<section><p class="section-title">BTTS + Over 2.5</p>${renderCombo(picks)}</section>` + historialCombo,
    ht05: notaHt05 + renderMercado(picks, "prob_over05_ht", "sug_ht05", "senal_ht05_tier", "cuota_ht_over05", "¿Gol antes del descanso?", "resultado_ht05", "ht05") + historialHt05,
    score: renderMarcadorExacto(picks, data.comparativo.historico.marcador_exacto),
    stats: renderEstadisticas(data),
  };

  document.getElementById("app").innerHTML = TABS.map((t) =>
    `<div class="tab-panel ${t.id===tabActivaAntes?'active':''}" id="panel-${t.id}">${panels[t.id]}</div>`
  ).join("");

  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tabActivaAntes));

  if(tabActivaAntes === "stats"){
    renderChart(data.serie_diaria);
  }

  if(totalHist === 0 && picks.length === 0){
    document.getElementById("app").innerHTML = '<div class="empty">Todavía no hay partidos evaluados. Vuelve pronto.</div>';
  }
}

function cargarDatos(){
  const url = "./dashboard_data.json?t=" + Date.now();
  fetch(url, {cache:"no-store"})
    .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(err => {
      // Si ya habia datos cargados antes, no reemplaces la pagina con el
      // error solo porque un refresco automatico fallo una vez - se
      // reintenta solo en el proximo ciclo.
      if(!DATA){
        document.getElementById("app").innerHTML = `
          <div class="error">
            No se pudo cargar dashboard_data.json.<br/>(${err.message})<br/><br/>
            Si acabas de configurar esto, corre el workflow de GitHub Actions una vez para generar el archivo.
          </div>`;
      }
    });
}

cargarDatos();
setInterval(cargarDatos, 5 * 60 * 1000); // se refresca solo cada 5 minutos
</script>
